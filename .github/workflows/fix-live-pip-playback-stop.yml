name: Fix ADWIO Live PiP Playback Stop

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-live-pip:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix real Live background stop cause
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import base64

          def dec(v):
              return base64.b64decode(v).decode("utf-8")

          def rep(path, old64, new64, label):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              old = dec(old64)
              new = dec(new64)
              if old not in text:
                  raise SystemExit(f"Missing expected block: {label}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          app = "app/src/main/java/com/adwio/player/AdwioApplication.kt"
          gradle = Path("app/build.gradle.kts")

          rep(app, "ICAgIHByaXZhdGUgdmFsIHN0b3BXaGVuQmFja2dyb3VuZCA9IFJ1bm5hYmxlIHsKICAgICAgICBpZiAocmVzdW1lZEFjdGl2aXRpZXMgPT0gMCkgc3RvcFBsYXliYWNrQ29tcGxldGVseSgpCiAgICB9", "", "background playback stopper")
          rep(app, "ICAgICAgICAvLyBBRFdJTyBwb2xpY3k6IHBsYXliYWNrIG11c3QgbmV2ZXIga2VlcCBydW5uaW5nIHdoZW4gdGhlIGFwcCBpcyBpbiBiYWNrZ3JvdW5kLgogICAgICAgIC8vIExpdmUgaXMgcHJlc2VydmVkIG9ubHkgYmV0d2VlbiBpdHMgTGlicmFyeSBtaW5pLXBsYXllciBhbmQgZnVsbHNjcmVlbiBQbGF5ZXJBY3Rpdml0eS4=", "", "background policy comment")

          g = gradle.read_text(encoding="utf-8")
          if 'versionCode = 33' not in g or 'versionName = "5.0.5.5"' not in g:
              raise SystemExit("Unexpected version baseline")
          g = g.replace('versionCode = 33', 'versionCode = 34', 1)
          g = g.replace('versionName = "5.0.5.5"', 'versionName = "5.0.5.6"', 1)
          gradle.write_text(g, encoding="utf-8")

          print("Root Live PiP playback-stop cause fixed.")
          PY

      - name: Verify focused fix
        shell: bash
        run: |
          set -euo pipefail

          APP="app/src/main/java/com/adwio/player/AdwioApplication.kt"

          grep -q 'val activeLive' "$APP"
          grep -q 'PlaybackEngine.currentType == MediaType.LIVE' "$APP"
          grep -q 'player.playWhenReady = true' "$APP"
          grep -q 'return@Runnable' "$APP"
          grep -q 'versionCode = 34' app/build.gradle.kts
          grep -q 'versionName = "5.0.5.6"' app/build.gradle.kts

          rm -f .github/workflows/fix-live-pip-playback-stop.yml

      - name: Commit root PiP fix
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          ALLOWED='^(app/build.gradle.kts|app/src/main/java/com/adwio/player/AdwioApplication.kt|.github/workflows/fix-live-pip-playback-stop.yml)$'
          BAD="$(git diff --cached --name-only | grep -Ev "$ALLOWED" || true)"

          if [ -n "$BAD" ]; then
            echo "Unexpected files changed:"
            echo "$BAD"
            exit 1
          fi

          git commit -m "Fix root Live PiP playback stop on Home"
          git push origin HEAD:main
