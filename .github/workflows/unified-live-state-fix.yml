name: ADWIO Unified Live State Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unified-live-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply unified Live state fix
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/unified_live_fix.py
          python3 /tmp/unified_live_fix.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Compile validation
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:compileDebugKotlin

      - name: Validate unified Live behavior
        shell: bash
        run: |
          set -euo pipefail
          HOME="app/src/main/java/com/adwio/player/ui/home/HomeActivity.kt"
          LIB="app/src/main/java/com/adwio/player/ui/library/LibraryActivity.kt"
          SPLASH="app/src/main/java/com/adwio/player/ui/splash/SplashActivity.kt"

          grep -q 'if (!activeLive)' "$HOME"
          grep -q 'putInt("resize_mode", liveFullscreenResizeMode)' "$LIB"
          grep -q 'persistLiveUiState()' "$LIB"
          grep -q 'Activity recreation / PiP task transitions' "$LIB"
          grep -q 'FLAG_ACTIVITY_REORDER_TO_FRONT' "$SPLASH"
          grep -q 'versionCode = 40' app/build.gradle.kts
          grep -q 'versionName = "5.2.2"' app/build.gradle.kts

          rm -f .github/workflows/unified-live-state-fix.yml

      - name: Commit only after successful compile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix unified Live fullscreen PiP and resume state"
          git push origin HEAD:main
