name: ADWIO Live Final Design and Fullscreen Fix V3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  live-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final Live update
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/live_final.py
          python3 /tmp/live_final.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Compile validation
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:compileDebugKotlin

      - name: Validate final Live markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'liveFullscreenMode = true' app/src/main/java/com/adwio/player/ui/library/LibraryActivity.kt
          grep -q 'bg_live_controls_premium' app/src/main/res/layout/activity_library.xml
          grep -q 'versionCode = 36' app/build.gradle.kts
          grep -q 'versionName = "5.1.1"' app/build.gradle.kts
          rm -f .github/workflows/live-final-design-fix-v3.yml

      - name: Commit final Live update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Live design and fullscreen channel switching"
          git push origin HEAD:main
