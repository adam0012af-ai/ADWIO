name: ADWIO Live Premium Final Design

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  live-final-design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Live Premium Final Design
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/live_design_final.py
          python3 /tmp/live_design_final.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Compile validation
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:compileDebugKotlin

      - name: Verify Live final design
        shell: bash
        run: |
          set -euo pipefail
          KT="app/src/main/java/com/adwio/player/ui/library/LibraryActivity.kt"
          XML="app/src/main/res/layout/activity_library.xml"
          grep -q 'Channels/Categories overlay remains independent' "$KT"
          grep -q 'android:layout_gravity="top|start"' "$XML"
          grep -q 'versionCode = 38' app/build.gradle.kts
          grep -q 'versionName = "5.2.0"' app/build.gradle.kts
          rm -f .github/workflows/live-premium-final-design.yml

      - name: Commit only after successful compile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize ADWIO Live premium UI and controls"
          git push origin HEAD:main
