name: ADWIO Signing Check

on:
  workflow_dispatch:

jobs:
  check-signing:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode keystore
        shell: bash
        env:
          ADWIO_KEYSTORE_BASE64: ${{ secrets.ADWIO_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ADWIO_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ADWIO_release_FINAL.keystore"
          echo "FILE SIZE:"
          wc -c "$RUNNER_TEMP/ADWIO_release_FINAL.keystore"
          echo "SHA256:"
          sha256sum "$RUNNER_TEMP/ADWIO_release_FINAL.keystore"

      - name: Check keystore password and alias
        shell: bash
        env:
          ADWIO_KEYSTORE_PASSWORD: ${{ secrets.ADWIO_KEYSTORE_PASSWORD }}
          ADWIO_KEY_ALIAS: ${{ secrets.ADWIO_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keytool -list \
            -keystore "$RUNNER_TEMP/ADWIO_release_FINAL.keystore" \
            -storetype PKCS12 \
            -storepass "$ADWIO_KEYSTORE_PASSWORD" \
            -alias "$ADWIO_KEY_ALIAS"
          echo "KEYSTORE PASSWORD + ALIAS = OK"

      - name: Check private key
        shell: bash
        env:
          ADWIO_KEYSTORE_PASSWORD: ${{ secrets.ADWIO_KEYSTORE_PASSWORD }}
          ADWIO_KEY_ALIAS: ${{ secrets.ADWIO_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keytool -importkeystore \
            -srckeystore "$RUNNER_TEMP/ADWIO_release_FINAL.keystore" \
            -srcstoretype PKCS12 \
            -srcstorepass "$ADWIO_KEYSTORE_PASSWORD" \
            -srcalias "$ADWIO_KEY_ALIAS" \
            -destkeystore "$RUNNER_TEMP/test-output.p12" \
            -deststoretype PKCS12 \
            -deststorepass "TemporaryTest123" \
            -noprompt
          echo "PRIVATE KEY = OK"

      - name: Signing check passed
        run: echo "ADWIO SIGNING CONFIGURATION OK"
