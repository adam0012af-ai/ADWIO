name: Fix ADWIO Live Fullscreen Persistence

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-live-fullscreen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fullscreen persistence fix
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/fix_live_fullscreen.py
          python3 /tmp/fix_live_fullscreen.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Compile validation
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:compileDebugKotlin

      - name: Verify exact fullscreen fix
        shell: bash
        run: |
          set -euo pipefail
          FILE="app/src/main/java/com/adwio/player/ui/library/LibraryActivity.kt"
          grep -q 'liveFullscreenResizeMode = AspectRatioFrameLayout.RESIZE_MODE_FILL' "$FILE"
          grep -q 'b.previewPlayer.resizeMode = liveFullscreenResizeMode' "$FILE"
          grep -q 'versionCode = 37' app/build.gradle.kts
          grep -q 'versionName = "5.1.2"' app/build.gradle.kts
          rm -f .github/workflows/fix-live-fullscreen-persistence.yml

      - name: Commit only after compile succeeds
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix persistent Live fullscreen sizing across channel changes"
          git push origin HEAD:main
