name: Reset ADWIO to Clean 5.0.3 Source V2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reset-to-503:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download original ADWIO 5.0.3 source
        shell: bash
        run: |
          set -euo pipefail

          URL="https://raw.githubusercontent.com/adam0012af-ai/ADWIO/4f1026235929afc428c5b92f95e45e165b3e23ff/ADWIO_5.0.3_ORIENTATION_SPORTS_FINAL.zip"

          curl -L --fail --retry 3 \
            "$URL" \
            -o /tmp/ADWIO_5.0.3_SOURCE.zip

          test -s /tmp/ADWIO_5.0.3_SOURCE.zip
          unzip -t /tmp/ADWIO_5.0.3_SOURCE.zip >/dev/null

          echo "Original 5.0.3 source downloaded successfully."

      - name: Remove ALL old project content
        shell: bash
        run: |
          set -euo pipefail

          # Preserve only Git metadata while this workflow is running.
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            -exec rm -rf {} +

          echo "All old source, APK, ZIP, workflows and build files removed."

      - name: Extract clean ADWIO 5.0.3
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/adwio503
          mkdir -p /tmp/adwio503

          unzip -q /tmp/ADWIO_5.0.3_SOURCE.zip -d /tmp/adwio503

          if [ -d /tmp/adwio503/ADWIO-main ]; then
            cp -a /tmp/adwio503/ADWIO-main/. .
          else
            cp -a /tmp/adwio503/. .
          fi

          # Clean anything we do not want carried from the archive.
          find . -type f \( -iname "*.apk" -o -iname "*.aab" \) -delete
          find . -type d \( -name "build" -o -name ".gradle" \) -prune -exec rm -rf {} +

          # We will create fresh workflows only.
          rm -rf .github
          mkdir -p .github/workflows

          echo "Clean ADWIO 5.0.3 source extracted."

      - name: Validate clean source
        shell: bash
        run: |
          set -euo pipefail

          test -f app/src/main/AndroidManifest.xml
          test -f app/build.gradle.kts || test -f app/build.gradle
          test -f settings.gradle.kts || test -f settings.gradle

          echo "Project structure is valid."

      - name: Create fresh APK build workflow
        shell: bash
        run: |
          set -euo pipefail

          cat > .github/workflows/build-adwio-clean.yml <<'YAML'
          name: Build ADWIO Clean APK

          on:
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            build:
              runs-on: ubuntu-latest

              steps:
                - name: Checkout repository
                  uses: actions/checkout@v4

                - name: Set up Java 17
                  uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: '17'

                - name: Set up Gradle 9.5.0
                  uses: gradle/actions/setup-gradle@v6
                  with:
                    gradle-version: '9.5.0'

                - name: Build Debug APK
                  shell: bash
                  run: |
                    set -euo pipefail
                    gradle --no-daemon :app:assembleDebug

                - name: Upload APK
                  uses: actions/upload-artifact@v4
                  with:
                    name: ADWIO-Clean-APK
                    path: app/build/outputs/apk/debug/*.apk
                    if-no-files-found: error
          YAML

      - name: Final cleanup check
        shell: bash
        run: |
          set -euo pipefail

          if find . -type f \( -iname "*.apk" -o -iname "*.aab" \) | grep -q .; then
            echo "ERROR: old APK/AAB files still exist."
            find . -type f \( -iname "*.apk" -o -iname "*.aab" \)
            exit 1
          fi

          echo "No old APK/AAB files remain."

      - name: Commit clean 5.0.3 project
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Reset repository to clean ADWIO 5.0.3 source"
          git push origin HEAD:main
