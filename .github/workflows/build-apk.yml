      - name: Check keystore password and alias
        shell: bash
        env:
          RAW_STORE_PASSWORD: ${{ secrets.ADWIO_KEYSTORE_PASSWORD }}
          ADWIO_KEY_ALIAS: ${{ secrets.ADWIO_KEY_ALIAS }}
        run: |
          set -euo pipefail

          STORE_PASSWORD="$(printf '%s' "$RAW_STORE_PASSWORD" | tr -d '\r\n')"

          echo "Password length: ${#STORE_PASSWORD}"

          keytool -list \
            -keystore "$RUNNER_TEMP/ADWIO_release_FINAL.keystore" \
            -storetype PKCS12 \
            -storepass "$STORE_PASSWORD" \
            -alias "$ADWIO_KEY_ALIAS"

          echo "KEYSTORE PASSWORD + ALIAS = OK"
