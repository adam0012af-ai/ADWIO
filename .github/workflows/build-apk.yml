name: ADWIO Signed Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Decode ADWIO release keystore
        shell: bash
        env:
          ADWIO_KEYSTORE_BASE64: ${{ secrets.ADWIO_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ADWIO_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ADWIO_release_FINAL.keystore"
          test -s "$RUNNER_TEMP/ADWIO_release_FINAL.keystore"

      - name: Build unsigned Release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --stacktrace

      - name: Sign release APK
        shell: bash
        env:
          RAW_STORE_PASSWORD: ${{ secrets.ADWIO_KEYSTORE_PASSWORD }}
          RAW_KEY_PASSWORD: ${{ secrets.ADWIO_KEY_PASSWORD }}
          ADWIO_KEY_ALIAS: ${{ secrets.ADWIO_KEY_ALIAS }}
        run: |
          set -euo pipefail
          STORE_PASSWORD="$(printf '%s' "$RAW_STORE_PASSWORD" | tr -d '\r\n')"
          KEY_PASSWORD="$(printf '%s' "$RAW_KEY_PASSWORD" | tr -d '\r\n')"
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="$RUNNER_TEMP/ADWIO-release-aligned.apk"
          SIGNED_APK="app/build/outputs/apk/release/ADWIO-release-signed.apk"
          KEYSTORE="$RUNNER_TEMP/ADWIO_release_FINAL.keystore"
          BUILD_TOOLS_VERSION="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          "$ZIPALIGN" -f -v 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$ADWIO_KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          SIGNED_APK="app/build/outputs/apk/release/ADWIO-release-signed.apk"
          BUILD_TOOLS_VERSION="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$SIGNED_APK"
          test -s "$SIGNED_APK"

      - name: Upload ADWIO Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ADWIO-Signed-Release
          path: app/build/outputs/apk/release/ADWIO-release-signed.apk
          if-no-files-found: error
          retention-days: 30
