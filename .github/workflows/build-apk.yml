name: Build ADWIO 4.2 SIGNED APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore fixed ADWIO signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ADWIO_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/adwio-release.keystore"

      - name: Build signed release APK
        shell: bash
        env:
          ADWIO_KEYSTORE_PATH: ${{ runner.temp }}/adwio-release.keystore
          ADWIO_KEYSTORE_PASSWORD: ${{ secrets.ADWIO_KEYSTORE_PASSWORD }}
          ADWIO_KEY_ALIAS: ${{ secrets.ADWIO_KEY_ALIAS }}
          ADWIO_KEY_PASSWORD: ${{ secrets.ADWIO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -x ./gradlew ]; then
            ./gradlew --no-daemon :app:assembleRelease
          else
            gradle --no-daemon :app:assembleRelease
          fi

      - name: Verify APK
        run: test -f app/build/outputs/apk/release/app-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ADWIO-Professional-4.2-SIGNED-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
