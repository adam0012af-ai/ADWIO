name: ADWIO Signed Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Decode ADWIO release keystore
        shell: bash
        run: |
          echo "${{ secrets.ADWIO_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/ADWIO_release_FINAL.keystore"

      - name: Build signed Release APK
        env:
          ADWIO_KEYSTORE_PATH: ${{ runner.temp }}/ADWIO_release_FINAL.keystore
          ADWIO_KEYSTORE_PASSWORD: ${{ secrets.ADWIO_KEYSTORE_PASSWORD }}
          ADWIO_KEY_ALIAS: ${{ secrets.ADWIO_KEY_ALIAS }}
          ADWIO_KEY_PASSWORD: ${{ secrets.ADWIO_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK exists
        shell: bash
        run: |
          ls -lah app/build/outputs/apk/release/
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Upload ADWIO Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ADWIO-Signed-Release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
