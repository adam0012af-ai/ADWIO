name: ADWIO Signed Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Decode release keystore
        shell: bash
        run: |
          echo "${{ secrets.ADWIO_KEYSTORE_BASE64 }}" | base64 --decode > android/app/ADWIO_release_FINAL.keystore

      - name: Create key.properties
        shell: bash
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ADWIO_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ADWIO_KEY_PASSWORD }}
          keyAlias=${{ secrets.ADWIO_KEY_ALIAS }}
          storeFile=ADWIO_release_FINAL.keystore
          EOF

      - name: Analyze project
        run: flutter analyze

      - name: Build signed release APK
        run: flutter build apk --release

      - name: Build signed release AAB
        run: flutter build appbundle --release

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ADWIO-Signed-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: ADWIO-Signed-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
