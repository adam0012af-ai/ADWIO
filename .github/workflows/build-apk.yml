name: Apply ADWIO 3.5 FOUNDATION

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify ADWIO 3.5 package
        run: |
          test -f ADWIO_Professional_3.5_FOUNDATION.zip || {
            echo "::error::ADWIO_Professional_3.5_FOUNDATION.zip not found in repository root"
            exit 1
          }

      - name: Extract ADWIO 3.5
        shell: bash
        run: |
          rm -rf /tmp/adwio_35
          mkdir -p /tmp/adwio_35
          unzip -q -o ADWIO_Professional_3.5_FOUNDATION.zip -d /tmp/adwio_35

          ROOT=$(find /tmp/adwio_35 -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)

          if [ -z "$ROOT" ]; then
            echo "::error::Android project root not found"
            find /tmp/adwio_35 -maxdepth 4 -type f | head -n 100
            exit 1
          fi

          echo "Project root: $ROOT"

          test -d "$ROOT/app" || {
            echo "::error::app/ missing from package"
            exit 1
          }

          test -f "$ROOT/build.gradle.kts" || {
            echo "::error::build.gradle.kts missing from package"
            exit 1
          }

          test -f "$ROOT/settings.gradle.kts" || {
            echo "::error::settings.gradle.kts missing from package"
            exit 1
          }

          rsync -a --delete             --exclude='.git/'             --exclude='.github/'             --exclude='ADWIO_Professional_3.5_FOUNDATION.zip'             "$ROOT"/ ./

          git checkout -- ADWIO_Professional_3.5_FOUNDATION.zip 2>/dev/null || true

      - name: Verify applied version
        shell: bash
        run: |
          grep -q 'versionCode = 11' app/build.gradle.kts || {
            echo "::error::versionCode 11 not found after apply"
            exit 1
          }

          grep -q 'versionName = "3.5.0"' app/build.gradle.kts || {
            echo "::error::versionName 3.5.0 not found after apply"
            exit 1
          }

          echo "ADWIO 3.5 source verified successfully."
          git status --short

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- . ':(exclude).github/**'

          if git diff --cached --quiet; then
            echo "No source changes detected."
            exit 0
          fi

          git commit -m "Apply ADWIO Professional 3.5 foundation"
          git push origin HEAD:main
