name: Fix ADWIO Live Playback Core

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-live-player:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Live playback core fix
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import base64

          def dec(v):
              return base64.b64decode(v).decode("utf-8")

          def replace_once(path, old64, new64, label):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              old = dec(old64)
              new = dec(new64)
              if old not in text:
                  raise SystemExit(f"Missing expected block: {label}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          engine = Path("app/src/main/java/com/adwio/player/ui/player/PlaybackEngine.kt")
          library = Path("app/src/main/java/com/adwio/player/ui/library/LibraryActivity.kt")
          player = Path("app/src/main/java/com/adwio/player/ui/player/PlayerActivity.kt")
          player_layout = Path("app/src/main/res/layout/activity_player.xml")
          library_layout = Path("app/src/main/res/layout/activity_library.xml")
          gradle = Path("app/build.gradle.kts")

          replace_once(str(engine), "aW1wb3J0IGFuZHJvaWQuY29udGVudC5Db250ZXh0CmltcG9ydCBhbmRyb2lkeC5tZWRpYTMuY29tbW9uLk1lZGlhSXRlbQo=", "aW1wb3J0IGFuZHJvaWQuY29udGVudC5Db250ZXh0CmltcG9ydCBhbmRyb2lkLmNvbnRlbnQuSW50ZW50CmltcG9ydCBhbmRyb2lkLm9zLkJ1aWxkCmltcG9ydCBhbmRyb2lkeC5jb3JlLmNvbnRlbnQuQ29udGV4dENvbXBhdAppbXBvcnQgYW5kcm9pZHgubWVkaWEzLmNvbW1vbi5NZWRpYUl0ZW0K", "PlaybackEngine imports")
          replace_once(str(engine), "ICAgICAgICB2YWwgcCA9IG9idGFpbihjb250ZXh0LCBzZXR0aW5ncykKCiAgICAgICAgY3VycmVudFRpdGxlID0gdGl0bGUKICAgICAgICBjdXJyZW50SWQgPSBpZAogICAgICAgIGN1cnJlbnRUeXBlID0gdHlwZQoKICAgICAgICBpZiAoY3VycmVudFVybCAhPSB1cmwpIHsK", "", "PlaybackEngine live service start")

          text = engine.read_text(encoding="utf-8")
          marker = "    fun updateMetadata(title: String, id: String, type: MediaType?) {"
          helper = dec("")
          if "private fun ensurePlaybackService(context: Context)" not in text:
              if marker not in text:
                  raise SystemExit("PlaybackEngine insertion marker missing")
              text = text.replace(marker, helper + marker, 1)
              engine.write_text(text, encoding="utf-8")

          replace_once(str(library), "ICAgICAgICBwZXJzaXN0TGl2ZVVpU3RhdGUoKQogICAgICAgIHJlc3RvcmVMaXZlT25SZXN1bWUgPSB0cnVlCgogICAgICAgIHN0YXJ0QWN0aXZpdHkoSW50ZW50KHRoaXMsIFBsYXllckFjdGl2aXR5OjpjbGFzcy5qYXZhKS5hcHBseSB7Cg==", "", "Mini -> fullscreen transfer")
          replace_once(str(library), "ICAgICAgICAgICAgICAgIHBlcnNpc3RMaXZlVWlTdGF0ZSgpCiAgICAgICAgICAgICAgICByZXN0b3JlTGl2ZU9uUmVzdW1lID0gdHJ1ZQogICAgICAgICAgICAgICAgc3RhcnRBY3Rpdml0eShJbnRlbnQodGhpcywgUGxheWVyQWN0aXZpdHk6OmNsYXNzLmphdmEpLmFwcGx5IHsK", "", "Second tap fullscreen transfer")
          replace_once(str(player), "ICAgICAgICBpZiAodHlwZSA9PSBNZWRpYVR5cGUuTElWRSkgewogICAgICAgICAgICByZXR1cm5pbmdUb0xpdmVQcmV2aWV3ID0gdHJ1ZQogICAgICAgICAgICBBcHBSZXN1bWVTdGF0ZSh0aGlzKS5jbGVhclBsYXliYWNrS2VlcGluZ0xpYnJhcnkoKQogICAgICAgICAgICBmaW5pc2goKQogICAgICAgICAgICByZXR1cm4KICAgICAgICB9Cg==", "", "Fullscreen -> mini transfer")

          # SurfaceView is the stable Media3 surface for PiP / surface handoff.
          for layout in (player_layout, library_layout):
              t = layout.read_text(encoding="utf-8")
              t = t.replace('app:surface_type="texture_view"', 'app:surface_type="surface_view"')
              layout.write_text(t, encoding="utf-8")

          # Install-safe version bump.
          g = gradle.read_text(encoding="utf-8")
          if 'versionCode = 29' in g:
              g = g.replace('versionCode = 29', 'versionCode = 30', 1)
          elif 'versionCode = 30' not in g:
              raise SystemExit("Unexpected versionCode baseline")

          if 'versionName = "5.0.5.1"' in g:
              g = g.replace('versionName = "5.0.5.1"', 'versionName = "5.0.5.2"', 1)
          gradle.write_text(g, encoding="utf-8")

          print("Live playback core fix applied.")
          PY

      - name: Verify Live playback architecture
        shell: bash
        run: |
          set -euo pipefail

          ENGINE="app/src/main/java/com/adwio/player/ui/player/PlaybackEngine.kt"
          LIB="app/src/main/java/com/adwio/player/ui/library/LibraryActivity.kt"
          PLAYER="app/src/main/java/com/adwio/player/ui/player/PlayerActivity.kt"

          grep -q 'ensurePlaybackService(context)' "$ENGINE"
          grep -q 'ContextCompat.startForegroundService' "$ENGINE"
          grep -q 'b.previewPlayer.player = null' "$LIB"
          grep -q 'b.playerView.player = null' "$PLAYER"
          grep -q 'app:surface_type="surface_view"' app/src/main/res/layout/activity_player.xml
          grep -q 'app:surface_type="surface_view"' app/src/main/res/layout/activity_library.xml
          grep -q 'versionCode = 30' app/build.gradle.kts

          # Temporary workflow removes itself after application.
          rm -f .github/workflows/fix-live-playback-core.yml

      - name: Commit Live playback core only
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          ALLOWED='^(app/build.gradle.kts|app/src/main/java/com/adwio/player/ui/player/PlaybackEngine.kt|app/src/main/java/com/adwio/player/ui/player/PlayerActivity.kt|app/src/main/java/com/adwio/player/ui/library/LibraryActivity.kt|app/src/main/res/layout/activity_player.xml|app/src/main/res/layout/activity_library.xml|.github/workflows/fix-live-playback-core.yml)$'
          BAD="$(git diff --cached --name-only | grep -Ev "$ALLOWED" || true)"

          if [ -n "$BAD" ]; then
            echo "Unexpected files changed:"
            echo "$BAD"
            exit 1
          fi

          git commit -m "Fix Live playback session and PiP surface continuity"
          git push origin HEAD:main
