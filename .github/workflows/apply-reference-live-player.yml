name: Apply ADWIO Reference Live Player Architecture

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-reference-live:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply single-player Live architecture
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import base64

          def dec(v):
              return base64.b64decode(v).decode("utf-8")

          def rep(path, old64, new64, label):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              old = dec(old64)
              new = dec(new64)
              if old not in text:
                  raise SystemExit(f"Missing expected block: {label}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          library = Path("app/src/main/java/com/adwio/player/ui/library/LibraryActivity.kt")
          engine = Path("app/src/main/java/com/adwio/player/ui/player/PlaybackEngine.kt")
          preview = Path("app/src/main/java/com/adwio/player/ui/player/AdwioPreviewPlayerView.kt")
          layout = Path("app/src/main/res/layout/activity_library.xml")
          gradle = Path("app/build.gradle.kts")

          rep(str(library), "", "", "Library imports")
          rep(str(library), "ICAgIHByaXZhdGUgdmFyIHdhc01pbmlQaXAgPSBmYWxzZQogICAgcHJpdmF0ZSB2YXIgcHJldmlld09yaWdpbmFsUGFyYW1zOiBMaW5lYXJMYXlvdXQuTGF5b3V0UGFyYW1zPyA9IG51bGwK", "ICAgIHByaXZhdGUgdmFyIHdhc01pbmlQaXAgPSBmYWxzZQogICAgcHJpdmF0ZSB2YXIgcHJldmlld09yaWdpbmFsUGFyYW1zOiBMaW5lYXJMYXlvdXQuTGF5b3V0UGFyYW1zPyA9IG51bGwKICAgIHByaXZhdGUgdmFyIGxpdmVGdWxsc2NyZWVuTW9kZSA9IGZhbHNlCg==", "Library fullscreen state")
          rep(str(library), "", "", "Library Live setup")
          rep(str(library), "", "", "Live PiP/fullscreen UI")
          rep(str(library), "", "ICAgIHByaXZhdGUgZnVuIG9wZW5DdXJyZW50TGl2ZUZ1bGxzY3JlZW4oKSB7CiAgICAgICAgZW50ZXJMaXZlRnVsbHNjcmVlbkluUGxhY2UoKQogICAgfQo=", "Live fullscreen action")
          rep(str(library), "", "ICAgICAgICAgICAgICAgIENoYW5uZWxOYXZpZ2F0b3Iuc2V0UXVldWUodmlzaWJsZSwgaXRlbS5pZCkKICAgICAgICAgICAgICAgIHBlcnNpc3RMaXZlVWlTdGF0ZSgpCgogICAgICAgICAgICAgICAgLy8gU2Vjb25kIHRhcCBlbmxhcmdlcyB0aGUgU0FNRSBsaXZlIHByZXZpZXcvcGxheWVyIGluLXBsYWNlLgogICAgICAgICAgICAgICAgZW50ZXJMaXZlRnVsbHNjcmVlbkluUGxhY2UoKQo=", "Live second-tap action")

          # Reference source keeps the live player owned by application context,
          # not by a foreground service. Remove the experimental service start.
          rep(str(engine), "aW1wb3J0IGFuZHJvaWQuY29udGVudC5Db250ZXh0CmltcG9ydCBhbmRyb2lkLmNvbnRlbnQuSW50ZW50CmltcG9ydCBhbmRyb2lkLm9zLkJ1aWxkCmltcG9ydCBhbmRyb2lkeC5jb3JlLmNvbnRlbnQuQ29udGV4dENvbXBhdAppbXBvcnQgYW5kcm9pZHgubWVkaWEzLmNvbW1vbi5NZWRpYUl0ZW0K", "aW1wb3J0IGFuZHJvaWQuY29udGVudC5Db250ZXh0CmltcG9ydCBhbmRyb2lkeC5tZWRpYTMuY29tbW9uLk1lZGlhSXRlbQo=", "PlaybackEngine imports")
          text = engine.read_text(encoding="utf-8")
          service_block = dec("")
          helper_block = dec("")
          if service_block in text:
              text = text.replace(service_block, "", 1)
          if helper_block in text:
              text = text.replace(helper_block, "", 1)
          engine.write_text(text, encoding="utf-8")

          # Callback-capable preview view: no Activity switch for LIVE fullscreen.
          preview.write_text(dec(""), encoding="utf-8")

          # Give the root a binding id so fullscreen/PiP can truly remove all outer padding.
          lt = layout.read_text(encoding="utf-8")
          root_old = '<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"\n    xmlns:app="http://schemas.android.com/apk/res-auto"\n    android:layout_width="match_parent"'
          root_new = '<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"\n    xmlns:app="http://schemas.android.com/apk/res-auto"\n    android:id="@+id/libraryRoot"\n    android:layout_width="match_parent"'
          if root_old not in lt:
              raise SystemExit("Library root layout pattern missing")
          lt = lt.replace(root_old, root_new, 1)
          layout.write_text(lt, encoding="utf-8")

          # Install-safe version bump.
          g = gradle.read_text(encoding="utf-8")
          if 'versionCode = 30' not in g or 'versionName = "5.0.5.2"' not in g:
              raise SystemExit("Unexpected ADWIO version baseline")
          g = g.replace('versionCode = 30', 'versionCode = 31', 1)
          g = g.replace('versionName = "5.0.5.2"', 'versionName = "5.0.5.3"', 1)
          gradle.write_text(g, encoding="utf-8")

          print("Reference Live architecture applied.")
          PY

      - name: Verify exact scope
        shell: bash
        run: |
          set -euo pipefail

          LIB="app/src/main/java/com/adwio/player/ui/library/LibraryActivity.kt"
          ENGINE="app/src/main/java/com/adwio/player/ui/player/PlaybackEngine.kt"
          PREVIEW="app/src/main/java/com/adwio/player/ui/player/AdwioPreviewPlayerView.kt"

          grep -q 'liveFullscreenMode' "$LIB"
          grep -q 'enterLiveFullscreenInPlace' "$LIB"
          grep -q 'applyExpandedLiveUi' "$LIB"
          grep -q 'setKeepContentOnPlayerReset(true)' "$LIB"
          grep -q 'onFullscreenRequested' "$PREVIEW"
          ! grep -q 'ensurePlaybackService' "$ENGINE"
          grep -q 'android:id="@+id/libraryRoot"' app/src/main/res/layout/activity_library.xml
          grep -q 'versionCode = 31' app/build.gradle.kts
          grep -q 'versionName = "5.0.5.3"' app/build.gradle.kts

          rm -f .github/workflows/apply-reference-live-player.yml

      - name: Commit reference Live architecture
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          ALLOWED='^(app/build.gradle.kts|app/src/main/java/com/adwio/player/ui/library/LibraryActivity.kt|app/src/main/java/com/adwio/player/ui/player/PlaybackEngine.kt|app/src/main/java/com/adwio/player/ui/player/AdwioPreviewPlayerView.kt|app/src/main/res/layout/activity_library.xml|.github/workflows/apply-reference-live-player.yml)$'
          BAD="$(git diff --cached --name-only | grep -Ev "$ALLOWED" || true)"

          if [ -n "$BAD" ]; then
            echo "Unexpected files changed:"
            echo "$BAD"
            exit 1
          fi

          git commit -m "Adopt stable single-player Live fullscreen and PiP architecture"
          git push origin HEAD:main
