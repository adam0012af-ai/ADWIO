name: Apply ADWIO V5 Crash Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify V5 package
        run: |
          test -f ADWIO_Update_V5.zip || { echo "ADWIO_Update_V5.zip NOT FOUND"; exit 1; }
          rm -rf .adwio_v5
          mkdir .adwio_v5
          unzip -o ADWIO_Update_V5.zip -d .adwio_v5
          grep -q 'versionCode = 5' .adwio_v5/app/build.gradle.kts || exit 1
          grep -q 'android:name=".AdwioApplication"' .adwio_v5/app/src/main/AndroidManifest.xml || exit 1
          test -f .adwio_v5/app/src/main/java/com/adwio/player/AdwioApplication.kt || exit 1
          test -f .adwio_v5/app/src/main/java/com/adwio/player/ui/crash/CrashActivity.kt || exit 1

      - name: Apply V5
        run: |
          cp -a .adwio_v5/app/. app/
          rm -rf .adwio_v5

      - name: Verify applied files
        run: |
          grep -q 'versionCode = 5' app/build.gradle.kts || exit 1
          grep -q 'android:name=".AdwioApplication"' app/src/main/AndroidManifest.xml || exit 1
          test -f app/src/main/java/com/adwio/player/AdwioApplication.kt || exit 1
          test -f app/src/main/java/com/adwio/player/ui/crash/CrashActivity.kt || exit 1
          echo "ADWIO V5 APPLIED AND VERIFIED"
          git status --short

      - name: Commit V5
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          if git diff --cached --quiet; then
            echo "No changes detected"
            exit 1
          fi
          git commit -m "Apply ADWIO V5 crash diagnostic fix"
          git push
