name: Unpack ADWIO Project

on:
  workflow_dispatch:
    inputs:
      zip_name:
        description: "ZIP file name in repository root"
        required: true
        default: "ADWIO_Player.zip"

jobs:
  unpack:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project
        env:
          ZIP_NAME: ${{ github.event.inputs.zip_name }}
        run: |
          set -e
          rm -rf /tmp/adwio_unpack
          mkdir -p /tmp/adwio_unpack
          unzip -o "$ZIP_NAME" -d /tmp/adwio_unpack

          # Copy project files but intentionally skip workflow files.
          # GitHub App tokens cannot create/update workflow files without
          # the separate "workflows" permission.
          rsync -a \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="UNPACK_WORKFLOW.yml" \
            --exclude="$ZIP_NAME" \
            /tmp/adwio_unpack/ ./

          rm -f "$ZIP_NAME"

      - name: Commit unpacked project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: unpack ADWIO project" || exit 0
          git push
