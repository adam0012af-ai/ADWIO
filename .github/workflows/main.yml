name: Apply ADWIO 3.8 PROFESSIONAL

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify ADWIO 3.8 package
        run: test -f ADWIO_Professional_3.8_FULL.zip
      - name: Extract ADWIO 3.8
        run: |
          rm -rf .adwio38
          mkdir .adwio38
          unzip -q ADWIO_Professional_3.8_FULL.zip -d .adwio38
          test -d .adwio38/ADWIO-main/app
          rsync -a --delete --exclude='.git/' --exclude='ADWIO_Professional_3.8_FULL.zip' .adwio38/ADWIO-main/ ./
          rm -rf .adwio38
      - name: Verify applied version
        run: |
          grep -q 'versionCode = 15' app/build.gradle.kts
          grep -q 'versionName = "3.8.0"' app/build.gradle.kts
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Apply ADWIO Professional 3.8"
          git push
