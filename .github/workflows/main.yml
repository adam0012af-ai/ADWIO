name: Apply ADWIO Professional FINAL

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify final package exists
        run: |
          test -f ADWIO_Professional_FINAL.zip || {
            echo "ADWIO_Professional_FINAL.zip not found in repository root"
            exit 1
          }

      - name: Extract final package
        run: |
          rm -rf _adwio_final_unpack
          mkdir -p _adwio_final_unpack
          unzip -q -o ADWIO_Professional_FINAL.zip -d _adwio_final_unpack

      - name: Detect package root
        id: pkg
        shell: bash
        run: |
          ROOT="_adwio_final_unpack"

          ENTRY_COUNT=$(find "$ROOT" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')
          if [ "$ENTRY_COUNT" = "1" ]; then
            ONLY_ENTRY=$(find "$ROOT" -mindepth 1 -maxdepth 1 | head -n 1)
            if [ -d "$ONLY_ENTRY" ] && \
               { [ -d "$ONLY_ENTRY/app" ] || [ -f "$ONLY_ENTRY/settings.gradle.kts" ]; }; then
              ROOT="$ONLY_ENTRY"
            fi
          fi

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Detected package root: $ROOT"

      - name: Validate extracted project
        shell: bash
        run: |
          ROOT="${{ steps.pkg.outputs.root }}"

          test -d "$ROOT/app" || {
            echo "Package is missing app/"
            exit 1
          }

          test -f "$ROOT/settings.gradle.kts" || {
            echo "Package is missing settings.gradle.kts"
            exit 1
          }

          test -f "$ROOT/build.gradle.kts" || {
            echo "Package is missing build.gradle.kts"
            exit 1
          }

      - name: Apply Professional project
        shell: bash
        run: |
          ROOT="${{ steps.pkg.outputs.root }}"

          rm -rf app docs
          rm -f build.gradle.kts settings.gradle.kts gradle.properties README.md .gitignore

          # IMPORTANT:
          # Do not touch .github/workflows from inside GitHub Actions.
          # GitHub blocks GITHUB_TOKEN from creating/updating workflow files.
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='ADWIO_Professional_FINAL.zip' \
            "$ROOT"/ ./

      - name: Clean old update archives
        run: |
          rm -f ADWIO_Update_V3.zip
          rm -f ADWIO_Update_V4.zip
          rm -f ADWIO_Update_V5.zip

      - name: Remove extraction folder
        run: rm -rf _adwio_final_unpack

      - name: Commit applied Professional update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Explicitly exclude workflow changes from the commit.
          git add -A -- . ':(exclude).github/workflows/**'

          if git diff --cached --quiet; then
            echo "No project changes to commit."
            exit 0
          fi

          git commit -m "Apply ADWIO Professional FINAL"
          git push
