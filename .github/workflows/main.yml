name: Apply ADWIO 5.0.2 Stability Final

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify package
        run: test -f ADWIO_5.0.2_STABILITY_FINAL.zip

      - name: Extract update
        shell: bash
        run: |
          set -euo pipefail
          TMP_DIR="${RUNNER_TEMP}/adwio502"
          rm -rf "$TMP_DIR"
          mkdir -p "$TMP_DIR"
          unzip -q ADWIO_5.0.2_STABILITY_FINAL.zip -d "$TMP_DIR"
          test -d "$TMP_DIR/ADWIO-main/app"

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            --exclude='ADWIO_5.0.2_STABILITY_FINAL.zip' \
            "$TMP_DIR/ADWIO-main/" ./

      - name: Verify version
        run: |
          grep -q 'versionCode = 25' app/build.gradle.kts
          grep -q 'versionName = "5.0.2"' app/build.gradle.kts

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Apply ADWIO 5.0.2 stability final"
          git push
