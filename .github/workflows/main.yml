name: Apply ADWIO 3.7 PROFESSIONAL

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify ADWIO 3.7 package
        shell: bash
        run: |
          test -f ADWIO_Professional_3.7_FULL.zip || {
            echo "::error::ADWIO_Professional_3.7_FULL.zip not found in repository root"
            exit 1
          }

      - name: Extract ADWIO 3.7
        shell: bash
        run: |
          rm -rf /tmp/adwio_37
          mkdir -p /tmp/adwio_37
          unzip -q -o ADWIO_Professional_3.7_FULL.zip -d /tmp/adwio_37

          ROOT=$(find /tmp/adwio_37 -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)
          test -n "$ROOT" || {
            echo "::error::Android project root not found"
            exit 1
          }

          test -d "$ROOT/app" || { echo "::error::app/ missing"; exit 1; }
          test -f "$ROOT/build.gradle.kts" || { echo "::error::build.gradle.kts missing"; exit 1; }
          test -f "$ROOT/settings.gradle.kts" || { echo "::error::settings.gradle.kts missing"; exit 1; }

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='ADWIO_Professional_3.7_FULL.zip' \
            "$ROOT"/ ./

          git checkout -- ADWIO_Professional_3.7_FULL.zip 2>/dev/null || true

      - name: Verify applied source
        shell: bash
        run: |
          grep -q 'versionCode = 14' app/build.gradle.kts
          grep -q 'versionName = "3.7.0"' app/build.gradle.kts
          test -f app/src/main/java/com/adwio/player/data/M3uCache.kt
          test -f app/src/main/res/drawable/ic_adwio.png
          echo "ADWIO 3.7 verified successfully"
          git status --short

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- . ':(exclude).github/**'

          if git diff --cached --quiet; then
            echo "No source changes detected."
            exit 0
          fi

          git commit -m "Apply ADWIO Professional 3.7"
          git push origin HEAD:main
