name: Apply ADWIO V4 Verified Update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify package exists
        run: |
          test -f ADWIO_Update_V4.zip || { echo "ADWIO_Update_V4.zip NOT FOUND"; exit 1; }

      - name: Extract package
        run: |
          rm -rf .adwio_v4
          mkdir .adwio_v4
          unzip -o ADWIO_Update_V4.zip -d .adwio_v4
          test -f .adwio_v4/app/build.gradle.kts || { echo "Invalid package: app/build.gradle.kts missing"; exit 1; }
          test -f .adwio_v4/app/src/main/java/com/adwio/player/ui/playlist/PlaylistActivity.kt || { echo "Invalid package: PlaylistActivity missing"; exit 1; }

      - name: Verify V4 before applying
        run: |
          grep -q 'versionCode = 4' .adwio_v4/app/build.gradle.kts || { echo "V4 versionCode missing"; exit 1; }
          grep -q 'versionName = "2.2.0"' .adwio_v4/app/build.gradle.kts || { echo "V4 versionName missing"; exit 1; }
          grep -q 'safeId' .adwio_v4/app/src/main/java/com/adwio/player/ui/playlist/PlaylistActivity.kt || { echo "Crash fix missing"; exit 1; }

      - name: Apply V4
        run: |
          cp -a .adwio_v4/app/. app/
          rm -rf .adwio_v4

      - name: Verify repository after applying
        run: |
          grep -q 'versionCode = 4' app/build.gradle.kts || { echo "APPLY FAILED: versionCode"; exit 1; }
          grep -q 'versionName = "2.2.0"' app/build.gradle.kts || { echo "APPLY FAILED: versionName"; exit 1; }
          grep -q 'safeId' app/src/main/java/com/adwio/player/ui/playlist/PlaylistActivity.kt || { echo "APPLY FAILED: crash fix"; exit 1; }
          test -f app/src/main/res/layout/item_poster.xml || { echo "APPLY FAILED: poster layout"; exit 1; }
          test -f app/src/main/res/layout/item_category.xml || { echo "APPLY FAILED: category layout"; exit 1; }
          echo "ADWIO V4 VERIFIED SUCCESSFULLY"
          git status --short

      - name: Commit V4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          if git diff --cached --quiet; then
            echo "ERROR: No app changes detected"
            exit 1
          fi
          git commit -m "Apply verified ADWIO V4 update"
          git push
