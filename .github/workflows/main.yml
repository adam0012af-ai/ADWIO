name: Apply ADWIO V3 Update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Check update package
        run: |
          if [ ! -f "ADWIO_Update_V3.zip" ]; then
            echo "ERROR: ADWIO_Update_V3.zip not found in repository root."
            exit 1
          fi

      - name: Extract update package
        run: |
          rm -rf .adwio_update_tmp
          mkdir -p .adwio_update_tmp
          unzip -o ADWIO_Update_V3.zip -d .adwio_update_tmp

      - name: Apply update files
        run: |
          if [ ! -d ".adwio_update_tmp/app" ]; then
            echo "ERROR: app folder not found inside update package."
            exit 1
          fi

          cp -a .adwio_update_tmp/app/. app/

      - name: Clean temporary files
        run: rm -rf .adwio_update_tmp

      - name: Show changed files
        run: git status --short

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Apply ADWIO V3 update"
          git push
