name: Apply ADWIO 5.0.6 99 Percent Premium

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify package
        run: test -f ADWIO_5.0.6_99_PERCENT_PREMIUM_PHASE1.zip

      - name: Extract patch
        shell: bash
        run: |
          set -euo pipefail
          TMP="${RUNNER_TEMP}/adwio506"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q ADWIO_5.0.6_99_PERCENT_PREMIUM_PHASE1.zip -d "$TMP"
          test -d "$TMP/ADWIO-main/app"
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            --exclude='ADWIO_5.0.6_99_PERCENT_PREMIUM_PHASE1.zip' \
            "$TMP/ADWIO-main/" ./

      - name: Verify patch
        run: |
          grep -q 'versionCode = 29' app/build.gradle.kts
          grep -q 'versionName = "5.0.6"' app/build.gradle.kts
          grep -q 'all_movies' app/src/main/res/values/strings_506.xml
          grep -q '3000L' app/src/main/java/com/adwio/player/ui/splash/SplashActivity.kt
          test -f app/src/main/res/layout/activity_login.xml
          test -f app/src/main/res/layout/activity_profile.xml

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Apply ADWIO 5.0.6 99 percent premium phase 1"
          git push
