name: Restore ADWIO Clean Master

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-master:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify stable snapshot
        shell: bash
        run: |
          set -euo pipefail
          STABLE_SHA="2d65c52ede28a38046ac97429cc55b28da39299a"
          git cat-file -e "${STABLE_SHA}^{commit}"
          echo "Stable ADWIO snapshot found: ${STABLE_SHA}"

      - name: Build clean source from exact snapshot
        shell: bash
        run: |
          set -euo pipefail

          STABLE_SHA="2d65c52ede28a38046ac97429cc55b28da39299a"
          CLEAN_DIR="${RUNNER_TEMP}/adwio-clean-master"

          rm -rf "$CLEAN_DIR"
          mkdir -p "$CLEAN_DIR"

          # Export the exact original source snapshot, without carrying
          # later 5.0.6 / 5.0.7 files into it.
          git archive "$STABLE_SHA" | tar -x -C "$CLEAN_DIR"

          # Remove every historical update/package ZIP.
          find "$CLEAN_DIR" -maxdepth 1 -type f \
            \( -iname '*.zip' -o -iname '*.rar' -o -iname '*.7z' \) \
            -print -delete

          # Remove historical release-note files.
          find "$CLEAN_DIR" -maxdepth 1 -type f \
            \( -name 'RELEASE_NOTES_*' -o -name '*PATCH*' -o -name '*RECOVERY*' \) \
            -print -delete

          # Remove development/update documentation accumulated over versions.
          rm -rf "$CLEAN_DIR/docs"

          # Keep ONE production APK workflow only.
          rm -f "$CLEAN_DIR/.github/workflows/main.yml"
          rm -f "$CLEAN_DIR/.github/workflows/signing-check.yml"

          # Safety checks: source itself must be present.
          test -f "$CLEAN_DIR/app/build.gradle.kts"
          test -f "$CLEAN_DIR/app/src/main/AndroidManifest.xml"
          test -d "$CLEAN_DIR/app/src/main/java"
          test -d "$CLEAN_DIR/app/src/main/res"
          test -f "$CLEAN_DIR/.github/workflows/build-apk.yml"

          # Confirm the intended clean baseline is 5.0.5.
          grep -q 'versionCode = 28' "$CLEAN_DIR/app/build.gradle.kts"
          grep -q 'versionName = "5.0.5"' "$CLEAN_DIR/app/build.gradle.kts"

          echo "Clean Master source prepared successfully."

      - name: Replace main working tree with Clean Master
        shell: bash
        run: |
          set -euo pipefail

          CLEAN_DIR="${RUNNER_TEMP}/adwio-clean-master"

          # Delete everything currently tracked/untracked except .git itself.
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

          # Copy the exact cleaned snapshot into main.
          rsync -a "$CLEAN_DIR/" ./

          echo "Final root:"
          ls -la

          # Final guarantees: no historical packages remain.
          if find . -maxdepth 1 -type f \
              \( -iname '*.zip' -o -iname '*.rar' -o -iname '*.7z' \) \
              | grep -q .; then
            echo "ERROR: archive file still exists in repository root."
            exit 1
          fi

          test -f .github/workflows/build-apk.yml
          test ! -f .github/workflows/main.yml
          test ! -f .github/workflows/signing-check.yml

      - name: Commit Clean Master
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Repository already matches Clean Master."
            exit 0
          fi

          git commit -m "Restore ADWIO 5.0.5 Clean Master"
          git push origin HEAD:main

      - name: Summary
        run: |
          echo "ADWIO Clean Master is now on main."
          echo "Baseline: original 5.0.5 snapshot 2d65c52"
          echo "Historical ZIPs, release notes, docs, and apply workflows removed."
          echo "Only production source and build-apk workflow retained."
