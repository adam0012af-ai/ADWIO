name: Apply ADWIO 5.0.5 Premium Continuity

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify package
        run: test -f ADWIO_5.0.5_PREMIUM_CONTINUITY_FINAL.zip

      - name: Extract update
        shell: bash
        run: |
          set -euo pipefail
          TMP_DIR="${RUNNER_TEMP}/adwio505"
          rm -rf "$TMP_DIR"
          mkdir -p "$TMP_DIR"

          unzip -q ADWIO_5.0.5_PREMIUM_CONTINUITY_FINAL.zip -d "$TMP_DIR"
          test -d "$TMP_DIR/ADWIO-main/app"

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            --exclude='ADWIO_5.0.5_PREMIUM_CONTINUITY_FINAL.zip' \
            "$TMP_DIR/ADWIO-main/" ./

      - name: Verify update
        run: |
          grep -q 'versionCode = 28' app/build.gradle.kts
          grep -q 'versionName = "5.0.5"' app/build.gradle.kts
          test -f app/src/main/java/com/adwio/player/data/AppResumeState.kt
          test -f app/src/main/java/com/adwio/player/ui/splash/SplashActivity.kt
          test -f app/src/main/res/drawable-nodpi/splash_premium_bg.webp
          grep -q 'enterMiniPictureInPicture' app/src/main/java/com/adwio/player/ui/library/LibraryActivity.kt
          grep -q 'nextEpisodePanel' app/src/main/res/layout/activity_player.xml

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Apply ADWIO 5.0.5 premium continuity"
          git push
