name: Apply ADWIO 3.8 PROFESSIONAL

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify ADWIO 3.8 package
        run: test -f ADWIO_Professional_3.8_FULL.zip

      - name: Extract ADWIO 3.8 safely
        shell: bash
        run: |
          set -euo pipefail

          TMP_DIR="${RUNNER_TEMP}/adwio38"
          rm -rf "$TMP_DIR"
          mkdir -p "$TMP_DIR"

          unzip -q ADWIO_Professional_3.8_FULL.zip -d "$TMP_DIR"
          test -d "$TMP_DIR/ADWIO-main/app"

          # Apply project files but NEVER modify GitHub workflow files.
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            --exclude='ADWIO_Professional_3.8_FULL.zip' \
            "$TMP_DIR/ADWIO-main/" ./

      - name: Verify applied version
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 15' app/build.gradle.kts
          grep -q 'versionName = "3.8.0"' app/build.gradle.kts

      - name: Commit and push project files only
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Explicitly stage only project content, never .github/workflows.
          git add app control-panel docs README.md RELEASE_NOTES_3.8.md build.gradle.kts gradle.properties settings.gradle.kts 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No project changes to commit."
            exit 0
          fi

          git commit -m "Apply ADWIO Professional 3.8"
          git push
