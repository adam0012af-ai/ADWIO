name: Apply ADWIO Package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ADWIO ZIP
        id: zip
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "ADWIO*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "No ADWIO ZIP found in repository root"
            exit 1
          fi

          echo "Found: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract package
        shell: bash
        run: |
          rm -rf /tmp/adwio_extract
          mkdir -p /tmp/adwio_extract

          unzip -o "${{ steps.zip.outputs.zip }}" -d /tmp/adwio_extract

          ROOT=$(find /tmp/adwio_extract -type f -name "settings.gradle.kts" -printf '%h\n' | head -n 1)

          if [ -z "$ROOT" ]; then
            echo "Android project root not found"
            find /tmp/adwio_extract -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "Project root: $ROOT"

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            "$ROOT/" ./

      - name: Commit extracted project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Apply ADWIO Professional 3.1 package"
            git push
          fi
