name: Unpack ADWIO Professional Update

on:
  workflow_dispatch:
    inputs:
      zip_name:
        description: "ZIP file name in repository root"
        required: true
        default: "ADWIO_Player_Professional_Update.zip"

jobs:
  unpack:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack professional update
        env:
          ZIP_NAME: ${{ github.event.inputs.zip_name }}
        run: |
          set -e

          if [ ! -f "$ZIP_NAME" ]; then
            echo "ZIP not found: $ZIP_NAME"
            echo "Files in repository root:"
            ls -la
            exit 1
          fi

          rm -rf /tmp/adwio_professional_unpack
          mkdir -p /tmp/adwio_professional_unpack

          unzip -o "$ZIP_NAME" -d /tmp/adwio_professional_unpack

          rsync -a \
            --delete \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="UNPACK_WORKFLOW.yml" \
            --exclude="$ZIP_NAME" \
            /tmp/adwio_professional_unpack/ ./

          rm -f "$ZIP_NAME"

      - name: Commit professional update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "feat: apply ADWIO Professional update"
          git push
