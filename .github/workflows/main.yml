name: Apply ADWIO 5.0.7 Stability Recovery

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify package
        run: test -f ADWIO_5.0.7_STABILITY_RECOVERY.zip

      - name: Apply recovery
        shell: bash
        run: |
          set -euo pipefail
          TMP="${RUNNER_TEMP}/adwio507"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q ADWIO_5.0.7_STABILITY_RECOVERY.zip -d "$TMP"
          test -d "$TMP/ADWIO-main/app"

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            --exclude='ADWIO_5.0.7_STABILITY_RECOVERY.zip' \
            "$TMP/ADWIO-main/" ./

      - name: Verify recovery
        run: |
          grep -q 'versionCode = 30' app/build.gradle.kts
          grep -q 'versionName = "5.0.7"' app/build.gradle.kts
          grep -q 'M3uXtreamResolver' app/src/main/java/com/adwio/player/ui/login/LoginActivity.kt
          grep -q '3000L' app/src/main/java/com/adwio/player/ui/splash/SplashActivity.kt
          test -f app/src/main/res/layout/activity_login.xml

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Apply ADWIO 5.0.7 stability recovery"
          git push
