name: Apply ADWIO 3.6 PROFESSIONAL

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate package
        id: package
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name 'ADWIO_Professional_3.6*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "::error::ADWIO Professional 3.6 ZIP not found in repository root"
            exit 1
          fi
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract package
        shell: bash
        run: |
          rm -rf /tmp/adwio_36
          mkdir -p /tmp/adwio_36
          unzip -q -o "${{ steps.package.outputs.zip }}" -d /tmp/adwio_36
          ROOT=$(find /tmp/adwio_36 -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)
          test -n "$ROOT" || { echo "::error::Android project root not found"; exit 1; }
          rsync -a --delete             --exclude='.git/'             --exclude='.github/'             "$ROOT"/ ./

      - name: Verify version
        shell: bash
        run: |
          grep -q 'versionCode = 13' app/build.gradle.kts
          grep -q 'versionName = "3.6.0"' app/build.gradle.kts
          echo "ADWIO 3.6 verified"

      - name: Commit source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':(exclude).github/**'
          if git diff --cached --quiet; then
            echo "No source changes detected."
            exit 0
          fi
          git commit -m "Apply ADWIO Professional 3.6"
          git push origin HEAD:main
