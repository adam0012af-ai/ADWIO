name: Apply ADWIO 5.0.7 FIX1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify package
        run: test -f ADWIO_5.0.7_FIX1_LOGIN_RESOURCES.zip

      - name: Apply fix
        shell: bash
        run: |
          set -euo pipefail
          TMP="${RUNNER_TEMP}/adwio507fix1"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q ADWIO_5.0.7_FIX1_LOGIN_RESOURCES.zip -d "$TMP"
          test -d "$TMP/ADWIO-main/app"

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            --exclude='ADWIO_5.0.7_FIX1_LOGIN_RESOURCES.zip' \
            "$TMP/ADWIO-main/" ./

      - name: Verify login resources
        run: |
          test -f app/src/main/res/drawable/bg_panel.xml
          test -f app/src/main/res/drawable/ic_eye.xml
          grep -q 'name="adwio_accent"' app/src/main/res/values/colors_507_fix.xml
          grep -q '@drawable/bg_panel' app/src/main/res/layout/activity_login.xml
          grep -q '@drawable/ic_eye' app/src/main/res/layout/activity_login.xml

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Fix ADWIO 5.0.7 login resources"
          git push
