name: ADWIO Live Task Stack Root Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  live-task-root-fix:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Android task stack fix
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/live_task_fix.py
          python3 /tmp/live_task_fix.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Compile validation
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:compileDebugKotlin

      - name: Validate task architecture
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="app/src/main/AndroidManifest.xml"
          LIB="app/src/main/java/com/adwio/player/ui/library/LibraryActivity.kt"

          grep -A6 'android:name=".ui.library.LibraryActivity"' "$MANIFEST" | grep -q 'android:launchMode="singleTask"'
          grep -q 'override fun onNewIntent(intent: Intent)' "$LIB"
          grep -q 'setIntent(intent)' "$LIB"
          grep -q 'restoreLiveSession(session)' "$LIB"
          grep -q 'versionCode = 42' app/build.gradle.kts
          grep -q 'versionName = "5.3.1"' app/build.gradle.kts

          rm -f .github/workflows/live-task-stack-root-fix.yml

      - name: Commit only after compile succeeds
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stabilize Live task stack and PiP return"
          git push origin HEAD:main
