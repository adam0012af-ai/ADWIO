name: ADWIO Reference Player Core Final

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reference-player-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply reference player architecture
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/reference_player_core.py
          python3 /tmp/reference_player_core.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Compile validation
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:compileDebugKotlin

      - name: Validate player architecture
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'prepareLivePipSurface' app/src/main/java/com/adwio/player/ui/library/LibraryActivity.kt
          grep -q 'livePipPlayer' app/src/main/res/layout/activity_library.xml
          grep -q 'preparePipSurface' app/src/main/java/com/adwio/player/ui/player/PlayerActivity.kt
          grep -q 'pipPlayerView' app/src/main/res/layout/activity_player.xml
          grep -q 'private fun configureAutoPip' app/src/main/java/com/adwio/player/ui/player/PlayerActivity.kt
          grep -q 'versionCode = 43' app/build.gradle.kts
          grep -q 'versionName = "5.4.0"' app/build.gradle.kts
          rm -f .github/workflows/reference-player-core-final.yml

      - name: Commit only after compile succeeds
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Adopt reference PiP surfaces and stabilize Live player core"
          git push origin HEAD:main
