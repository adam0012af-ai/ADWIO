name: Apply ADWIO Live Premium Phase 1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  live-premium:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Live-only premium changes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import base64

          def dec(s):
              return base64.b64decode(s).decode("utf-8")

          def rep(path, old64, new64, label):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              old = dec(old64)
              new = dec(new64)
              if old not in text:
                  raise SystemExit(f"Missing expected block: {label}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          library = Path("app/src/main/java/com/adwio/player/ui/library/LibraryActivity.kt")
          player = Path("app/src/main/java/com/adwio/player/ui/player/PlayerActivity.kt")

          rep(str(library), "", "", "Live onUserLeaveHint")
          rep(str(library), "ICAgICAgICBiLnByZXZpZXdQbGF5ZXIucGxheWVyID0gcGxheWVyCiAgICAgICAgcGxheWVyLnZvbHVtZSA9IDFmCiAgICAgICAgYi5wcmV2aWV3UGxheWVyLnJlcXVlc3RGb2N1cygp", "ICAgICAgICBiLnByZXZpZXdQbGF5ZXIucGxheWVyID0gcGxheWVyCiAgICAgICAgcGxheWVyLnZvbHVtZSA9IDFmCiAgICAgICAgY29uZmlndXJlTGl2ZUF1dG9QaXAoKQogICAgICAgIGIucHJldmlld1BsYXllci5yZXF1ZXN0Rm9jdXMoKQ==", "Live preview attach")
          rep(str(library), "", "", "Live onStart attach")

          text = library.read_text(encoding="utf-8")
          marker = "    private fun enterMiniPictureInPicture() {"
          helper = dec("")
          if "private fun configureLiveAutoPip()" not in text:
              if marker not in text:
                  raise SystemExit("Live PiP helper marker missing")
              text = text.replace(marker, helper + marker, 1)
              library.write_text(text, encoding="utf-8")

          rep(str(player), "", "", "Live fullscreen resize")
          rep(str(player), "ICAgIG92ZXJyaWRlIGZ1biBvblVzZXJMZWF2ZUhpbnQoKSB7CiAgICAgICAgaWYgKFBsYXliYWNrRW5naW5lLnBsYXllcj8uaXNQbGF5aW5nID09IHRydWUpIHsKICAgICAgICAgICAgZW50ZXJpbmdQaXAgPSB0cnVlCiAgICAgICAgICAgIG1heWJlRW50ZXJQaXAoKQogICAgICAgIH0KICAgICAgICBzdXBlci5vblVzZXJMZWF2ZUhpbnQoKQogICAgfQ==", "", "Fullscreen Live PiP fallback")
          rep(str(player), "ICAgICAgICBiLnBsYXllclZpZXcucGxheWVyID0gcAogICAgICAgIGIucGxheWVyVmlldy5yZXNpemVNb2RlID0gcmVzaXplTW9kZQogICAgICAgIHAucGxheVdoZW5SZWFkeSA9IHRydWUKICAgICAgICB1cGRhdGVRdWFsaXR5KCkKICAgICAgICB1cGRhdGVQbGF5UGF1c2VJY29uKCk=", "ICAgICAgICBiLnBsYXllclZpZXcucGxheWVyID0gcAogICAgICAgIGIucGxheWVyVmlldy5yZXNpemVNb2RlID0gcmVzaXplTW9kZQogICAgICAgIHAucGxheVdoZW5SZWFkeSA9IHRydWUKICAgICAgICBjb25maWd1cmVGdWxsc2NyZWVuTGl2ZUF1dG9QaXAoKQogICAgICAgIHVwZGF0ZVF1YWxpdHkoKQogICAgICAgIHVwZGF0ZVBsYXlQYXVzZUljb24oKQ==", "Fullscreen Live attach")

          text = player.read_text(encoding="utf-8")
          marker = "    private fun maybeEnterPip() {"
          helper = dec("")
          if "private fun configureFullscreenLiveAutoPip()" not in text:
              if marker not in text:
                  raise SystemExit("Fullscreen Live PiP helper marker missing")
              text = text.replace(marker, helper + marker, 1)
              player.write_text(text, encoding="utf-8")

          # Live-only visual assets.
          Path("app/src/main/res/drawable/bg_live_channel_premium.xml").write_text(
          '''<selector xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:state_focused="true">
                  <shape android:shape="rectangle">
                      <corners android:radius="12dp"/>
                      <gradient android:angle="0" android:startColor="#2635D6FF" android:endColor="#18151E2E"/>
                      <stroke android:width="1dp" android:color="#8035D6FF"/>
                  </shape>
              </item>
              <item android:state_pressed="true">
                  <shape android:shape="rectangle">
                      <corners android:radius="12dp"/>
                      <solid android:color="#2435D6FF"/>
                      <stroke android:width="1dp" android:color="#AA35D6FF"/>
                  </shape>
              </item>
              <item>
                  <shape android:shape="rectangle">
                      <corners android:radius="12dp"/>
                      <gradient android:angle="0" android:startColor="#D50B1422" android:endColor="#D50A101B"/>
                      <stroke android:width="1dp" android:color="#283E526B"/>
                  </shape>
              </item>
          </selector>''', encoding="utf-8")

          Path("app/src/main/res/drawable/bg_live_preview_premium.xml").write_text(
          '''<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <corners android:radius="16dp"/>
              <gradient android:angle="0" android:startColor="#EE08101B" android:endColor="#EE0B1626"/>
              <stroke android:width="1dp" android:color="#4D35D6FF"/>
          </shape>''', encoding="utf-8")

          Path("app/src/main/res/layout/item_media.xml").write_text(
          '''<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="44dp"
              android:layout_marginBottom="4dp"
              android:background="@drawable/bg_live_channel_premium"
              android:clickable="true"
              android:focusable="true"
              android:gravity="center_vertical"
              android:orientation="horizontal"
              android:paddingStart="7dp"
              android:paddingEnd="6dp">

              <FrameLayout
                  android:layout_width="32dp"
                  android:layout_height="32dp">

                  <ImageView
                      android:id="@+id/logoImage"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:background="#12000000"
                      android:padding="2dp"
                      android:scaleType="centerInside"
                      android:src="@drawable/ic_adwio"/>

                  <View
                      android:layout_width="5dp"
                      android:layout_height="5dp"
                      android:layout_gravity="end|bottom"
                      android:layout_margin="2dp"
                      android:background="@drawable/bg_live_dot"/>
              </FrameLayout>

              <LinearLayout
                  android:layout_width="0dp"
                  android:layout_height="wrap_content"
                  android:layout_marginStart="8dp"
                  android:layout_weight="1"
                  android:orientation="vertical">

                  <TextView
                      android:id="@+id/nameText"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:ellipsize="end"
                      android:maxLines="1"
                      android:textColor="@color/adwio_text"
                      android:textSize="10.5sp"
                      android:textStyle="bold"/>

                  <TextView
                      android:id="@+id/metaText"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="1dp"
                      android:ellipsize="end"
                      android:maxLines="1"
                      android:textColor="@color/adwio_muted"
                      android:textSize="7.2sp"/>
              </LinearLayout>

              <TextView
                  android:id="@+id/favoriteText"
                  android:layout_width="28dp"
                  android:layout_height="28dp"
                  android:gravity="center"
                  android:text="☆"
                  android:textColor="@color/adwio_cyan"
                  android:textSize="14sp"/>
          </LinearLayout>''', encoding="utf-8")

          Path("app/src/main/res/drawable/bg_live_dot.xml").write_text(
          '''<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#35D6FF"/>
          </shape>''', encoding="utf-8")

          # The preview panel is only visible for LIVE, so this visual change cannot affect Movies/Series.
          layout = Path("app/src/main/res/layout/activity_library.xml")
          lt = layout.read_text(encoding="utf-8")
          lt = lt.replace(
              'android:background="@drawable/bg_preview_panel"',
              'android:background="@drawable/bg_live_preview_premium"',
              1
          )
          layout.write_text(lt, encoding="utf-8")

          print("ADWIO Live Premium Phase 1 applied.")
          PY

      - name: Verify Live phase scope
        shell: bash
        run: |
          set -euo pipefail

          grep -q 'configureLiveAutoPip' app/src/main/java/com/adwio/player/ui/library/LibraryActivity.kt
          grep -q 'configureFullscreenLiveAutoPip' app/src/main/java/com/adwio/player/ui/player/PlayerActivity.kt
          grep -q 'type == MediaType.LIVE' app/src/main/java/com/adwio/player/ui/player/PlayerActivity.kt
          grep -q 'RESIZE_MODE_ZOOM' app/src/main/java/com/adwio/player/ui/player/PlayerActivity.kt
          test -f app/src/main/res/drawable/bg_live_channel_premium.xml
          test -f app/src/main/res/drawable/bg_live_preview_premium.xml
          test -f app/src/main/res/drawable/bg_live_dot.xml

          rm -f .github/workflows/live-premium-phase1.yml

      - name: Commit Live Premium Phase 1
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          ALLOWED='^(app/src/main/java/com/adwio/player/ui/library/LibraryActivity.kt|app/src/main/java/com/adwio/player/ui/player/PlayerActivity.kt|app/src/main/res/layout/item_media.xml|app/src/main/res/layout/activity_library.xml|app/src/main/res/drawable/bg_live_channel_premium.xml|app/src/main/res/drawable/bg_live_preview_premium.xml|app/src/main/res/drawable/bg_live_dot.xml|.github/workflows/live-premium-phase1.yml)$'
          BAD="$(git diff --cached --name-only | grep -Ev "$ALLOWED" || true)"

          if [ -n "$BAD" ]; then
            echo "Unexpected files changed:"
            echo "$BAD"
            exit 1
          fi

          git commit -m "Apply ADWIO Live Premium Phase 1"
          git push origin HEAD:main
