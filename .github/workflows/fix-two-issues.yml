name: Fix ADWIO Playback PiP and Section Counts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply only the two approved fixes
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          root = Path(".")
          player = root / "app/src/main/java/com/adwio/player/ui/player/PlayerActivity.kt"
          library = root / "app/src/main/java/com/adwio/player/ui/library/LibraryActivity.kt"
          player_layout = root / "app/src/main/res/layout/activity_player.xml"
          library_layout = root / "app/src/main/res/layout/activity_library.xml"
          strings = root / "app/src/main/res/values/strings.xml"
          strings_ar = root / "app/src/main/res/values-ar/strings.xml"
          gradle = root / "app/build.gradle.kts"

          def replace_once(path, old, new, label):
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"FAILED: pattern not found for {label} in {path}")
              text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")

          replace_once(
              player,
              '''    override fun onUserLeaveHint() {
                  if (settings.pictureInPicture && PlaybackEngine.player?.isPlaying == true) {
                      enteringPip = true
                      maybeEnterPip()
                  }
                  super.onUserLeaveHint()
              }''',
              '''    override fun onUserLeaveHint() {
                  if (PlaybackEngine.player?.isPlaying == true) {
                      enteringPip = true
                      maybeEnterPip()
                  }
                  super.onUserLeaveHint()
              }''',
              "PlayerActivity mandatory PiP"
          )

          replace_once(
              player,
              '''    override fun onPictureInPictureModeChanged(isInPictureInPictureMode: Boolean, newConfig: Configuration) {
                  super.onPictureInPictureModeChanged(isInPictureInPictureMode, newConfig)
                  inPip = isInPictureInPictureMode
                  enteringPip = false
                  if (inPip) {
                      wasInPip = true
                      b.playerControls.visibility = View.GONE
                      b.backControlButton.visibility = View.GONE
                      b.liveBrowseOverlay.visibility = View.GONE
                      b.statusText.visibility = View.GONE
                  }
              }''',
              '''    override fun onPictureInPictureModeChanged(isInPictureInPictureMode: Boolean, newConfig: Configuration) {
                  super.onPictureInPictureModeChanged(isInPictureInPictureMode, newConfig)
                  inPip = isInPictureInPictureMode
                  enteringPip = false
                  if (inPip) {
                      wasInPip = true
                      b.playerControls.visibility = View.GONE
                      b.backControlButton.visibility = View.GONE
                      b.liveBrowseOverlay.visibility = View.GONE
                      b.statusText.visibility = View.GONE
                  } else {
                      PlaybackEngine.player?.let { activePlayer ->
                          b.playerView.player = activePlayer
                          b.playerView.resizeMode = resizeMode
                          activePlayer.playWhenReady = true
                      }
                      showControls()
                  }
              }''',
              "PlayerActivity PiP return attachment"
          )

          replace_once(
              player,
              '''    override fun onStop() {
                  handler.removeCallbacksAndMessages(null)
                  savePosition()

                  val keepForPip = inPip || enteringPip ||
                      (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N && isInPictureInPictureMode)

                  if (!keepForPip) {
                      PlaybackEngine.player?.removeListener(playerListener)
                      b.playerView.player = null
                  }

                  if (!returningToLivePreview && !keepForPip && !wasInPip) {
                      PlaybackEngine.stopAndRelease()
                      stopService(Intent(this, PlaybackService::class.java))
                  }
                  super.onStop()
              }''',
              '''    override fun onStop() {
                  handler.removeCallbacksAndMessages(null)
                  savePosition()

                  val playbackActive =
                      PlaybackEngine.player != null &&
                      PlaybackEngine.currentUrl.isNotBlank() &&
                      PlaybackEngine.player?.playWhenReady == true

                  val keepForPip = inPip || enteringPip ||
                      (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N && isInPictureInPictureMode)

                  val keepForBackground = !isFinishing && playbackActive
                  val keepPlayer = keepForPip || keepForBackground

                  if (!keepPlayer) {
                      PlaybackEngine.player?.removeListener(playerListener)
                      b.playerView.player = null
                  }

                  if (!returningToLivePreview && !keepPlayer && !wasInPip) {
                      PlaybackEngine.stopAndRelease()
                      stopService(Intent(this, PlaybackService::class.java))
                  }
                  super.onStop()
              }''',
              "PlayerActivity background retention"
          )

          replace_once(
              player,
              '''    private fun maybeEnterPip() {
                  if (!settings.pictureInPicture || Build.VERSION.SDK_INT < Build.VERSION_CODES.O) {
                      enteringPip = false
                      return
                  }
                  runCatching {
                      val entered = enterPictureInPictureMode(
                          PictureInPictureParams.Builder()
                              .setAspectRatio(Rational(16, 9))
                              .build()
                      )
                      inPip = entered
                      if (!entered) enteringPip = false
                  }.onFailure {
                      enteringPip = false
                  }
              }''',
              '''    private fun maybeEnterPip() {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.O) {
                      enteringPip = false
                      return
                  }

                  val format = PlaybackEngine.player?.videoFormat
                  val width = format?.width?.takeIf { it > 0 } ?: 16
                  val height = format?.height?.takeIf { it > 0 } ?: 9
                  val ratio = runCatching { Rational(width, height) }.getOrDefault(Rational(16, 9))

                  runCatching {
                      val entered = enterPictureInPictureMode(
                          PictureInPictureParams.Builder()
                              .setAspectRatio(ratio)
                              .build()
                      )
                      inPip = entered
                      if (!entered) enteringPip = false
                  }.onFailure {
                      enteringPip = false
                  }
              }''',
              "PlayerActivity PiP ratio"
          )

          replace_once(
              library,
              '''    override fun onUserLeaveHint() {
                  if (type == MediaType.LIVE &&
                      AppSettings(this).pictureInPicture &&
                      PlaybackEngine.player?.isPlaying == true &&
                      Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                  ) {
                      enterMiniPictureInPicture()
                  }
                  super.onUserLeaveHint()
              }''',
              '''    override fun onUserLeaveHint() {
                  if (type == MediaType.LIVE &&
                      PlaybackEngine.player?.isPlaying == true &&
                      Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                  ) {
                      enterMiniPictureInPicture()
                  }
                  super.onUserLeaveHint()
              }''',
              "Library mandatory mini PiP"
          )

          replace_once(
              library,
              '''    override fun onStop() {
                  previewJob?.cancel()

                  val keepPlayerAttached = inMiniPip || enteringMiniPip ||
                      (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N && isInPictureInPictureMode)

                  if (!keepPlayerAttached) {
                      b.previewPlayer.player = null
                  }
                  super.onStop()
              }''',
              '''    override fun onStop() {
                  previewJob?.cancel()

                  val playbackActive =
                      PlaybackEngine.player != null &&
                      PlaybackEngine.currentType == MediaType.LIVE &&
                      PlaybackEngine.currentUrl.isNotBlank() &&
                      PlaybackEngine.player?.playWhenReady == true

                  val keepForPip = inMiniPip || enteringMiniPip ||
                      (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N && isInPictureInPictureMode)

                  val keepForBackground = !isFinishing && playbackActive
                  val keepPlayerAttached = keepForPip || keepForBackground

                  if (!keepPlayerAttached) {
                      b.previewPlayer.player = null
                  }
                  super.onStop()
              }''',
              "Library mini player background retention"
          )

          replace_once(
              player_layout,
              '''        android:keepScreenOn="true"
                  app:use_controller="false"/>''',
              '''        android:keepScreenOn="true"
                  app:surface_type="texture_view"
                  app:use_controller="false"/>''',
              "Fullscreen player TextureView"
          )

          replace_once(
              library_layout,
              '''                    android:focusable="true"
                              app:use_controller="false"/>''',
              '''                    android:focusable="true"
                              app:surface_type="texture_view"
                              app:use_controller="false"/>''',
              "Mini player TextureView"
          )

          replace_once(
              library,
              '''        val totalLabel = java.text.NumberFormat.getIntegerInstance().format(items.size)
                  val named = (if (cats.isEmpty()) listOf(CategoryModel("", getString(R.string.all))) else cats).map {
                      if (it.id.isBlank()) it.copy(name = "${getString(R.string.all_channels)} ($totalLabel)") else it
                  }

                  val allCategory = named.firstOrNull { it.id.isBlank() }
                      ?: CategoryModel("", "${getString(R.string.all_channels)} ($totalLabel)")''',
              '''        val totalLabel = java.text.NumberFormat.getIntegerInstance().format(items.size)
                  val allSectionLabel = when (type) {
                      MediaType.LIVE -> getString(R.string.all_channels)
                      MediaType.MOVIE -> getString(R.string.all_movies)
                      MediaType.SERIES -> getString(R.string.all_series)
                  }

                  val named = (if (cats.isEmpty()) listOf(CategoryModel("", allSectionLabel)) else cats).map {
                      if (it.id.isBlank()) it.copy(name = "$allSectionLabel ($totalLabel)") else it
                  }

                  val allCategory = named.firstOrNull { it.id.isBlank() }
                      ?: CategoryModel("", "$allSectionLabel ($totalLabel)")''',
              "Correct section count labels"
          )

          s = strings.read_text(encoding="utf-8")
          if 'name="all_movies"' not in s:
              s = s.replace(
                  '    <string name="all">ALL</string>',
                  '    <string name="all">ALL</string>\n'
                  '    <string name="all_movies">ALL MOVIES</string>\n'
                  '    <string name="all_series">ALL SERIES</string>'
              )
              strings.write_text(s, encoding="utf-8")

          if strings_ar.exists():
              s = strings_ar.read_text(encoding="utf-8")
              if 'name="all_movies"' not in s:
                  s = s.replace(
                      '</resources>',
                      '    <string name="all_movies">كل الأفلام</string>\n'
                      '    <string name="all_series">كل المسلسلات</string>\n'
                      '</resources>'
                  )
                  strings_ar.write_text(s, encoding="utf-8")

          g = gradle.read_text(encoding="utf-8")
          g = g.replace('versionCode = 28', 'versionCode = 29', 1)
          g = g.replace('versionName = "5.0.5"', 'versionName = "5.0.5.1"', 1)
          gradle.write_text(g, encoding="utf-8")

          print("Approved fixes applied.")
          PY

      - name: Verify and keep repository clean
        shell: bash
        run: |
          set -euo pipefail

          grep -q 'versionCode = 29' app/build.gradle.kts
          grep -q 'versionName = "5.0.5.1"' app/build.gradle.kts
          grep -q 'getString(R.string.all_movies)' app/src/main/java/com/adwio/player/ui/library/LibraryActivity.kt
          grep -q 'getString(R.string.all_series)' app/src/main/java/com/adwio/player/ui/library/LibraryActivity.kt
          grep -q 'keepForBackground = !isFinishing && playbackActive' app/src/main/java/com/adwio/player/ui/player/PlayerActivity.kt
          grep -q 'app:surface_type="texture_view"' app/src/main/res/layout/activity_player.xml
          grep -q 'app:surface_type="texture_view"' app/src/main/res/layout/activity_library.xml

          rm -f .github/workflows/fix-two-issues.yml

      - name: Commit only these fixes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          ALLOWED='^(app/build.gradle.kts|app/src/main/java/com/adwio/player/ui/player/PlayerActivity.kt|app/src/main/java/com/adwio/player/ui/library/LibraryActivity.kt|app/src/main/res/layout/activity_player.xml|app/src/main/res/layout/activity_library.xml|app/src/main/res/values/strings.xml|app/src/main/res/values-ar/strings.xml|.github/workflows/fix-two-issues.yml)$'
          BAD="$(git diff --cached --name-only | grep -Ev "$ALLOWED" || true)"
          if [ -n "$BAD" ]; then
            echo "Unexpected files changed:"
            echo "$BAD"
            exit 1
          fi

          git commit -m "Fix PiP playback continuity and section counts"
          git push origin HEAD:main
