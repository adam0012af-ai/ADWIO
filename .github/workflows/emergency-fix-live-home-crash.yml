name: Emergency Fix ADWIO Live Home Crash

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emergency-live-fix:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove crash source and fix duplicate icon
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import base64

          def dec(v):
              return base64.b64decode(v).decode("utf-8")

          def rep(path, old64, new64, label):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              old = dec(old64)
              new = dec(new64)
              if old not in text:
                  raise SystemExit(f"Missing expected block: {label}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          engine = "app/src/main/java/com/adwio/player/ui/player/PlaybackEngine.kt"
          layout = "app/src/main/res/layout/activity_library.xml"
          gradle = Path("app/build.gradle.kts")

          rep(engine, "aW1wb3J0IGFuZHJvaWQuY29udGVudC5Db250ZXh0CmltcG9ydCBhbmRyb2lkLmNvbnRlbnQuSW50ZW50CmltcG9ydCBhbmRyb2lkLm9zLkJ1aWxkCmltcG9ydCBhbmRyb2lkeC5jb3JlLmNvbnRlbnQuQ29udGV4dENvbXBhdAppbXBvcnQgYW5kcm9pZHgubWVkaWEzLmNvbW1vbi5NZWRpYUl0ZW0K", "aW1wb3J0IGFuZHJvaWQuY29udGVudC5Db250ZXh0CmltcG9ydCBhbmRyb2lkeC5tZWRpYTMuY29tbW9uLk1lZGlhSXRlbQo=", "PlaybackEngine service imports")
          rep(engine, "", "ICAgICAgICByZXR1cm4gcAogICAgfQoKICAgIGZ1biB1cGRhdGVNZXRhZGF0YQ==", "Live foreground service block")
          rep(layout, "YW5kcm9pZDpzcmM9IkBkcmF3YWJsZS9pY196b29tIgogICAgICAgICAgICAgICAgICAgIGFuZHJvaWQ6dmlzaWJpbGl0eT0iZ29uZSIvPg==", "YW5kcm9pZDpzcmM9IkBkcmF3YWJsZS9pY19hc3BlY3RfcmF0aW9fbGl2ZSIKICAgICAgICAgICAgICAgICAgICBhbmRyb2lkOnZpc2liaWxpdHk9ImdvbmUiLz4=", "Aspect icon")

          Path("app/src/main/res/drawable/ic_aspect_ratio_live.xml").write_text(
          '''<vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M4,6h16v12H4zM6,8v8h12V8zM8,10h3v2H9.5v1.5H8zM13,12h3v2h-1.5v1.5H13z"/>
          </vector>''',
          encoding="utf-8")

          g = gradle.read_text(encoding="utf-8")
          if 'versionCode = 32' not in g or 'versionName = "5.0.5.4"' not in g:
              raise SystemExit("Unexpected version baseline")
          g = g.replace('versionCode = 32', 'versionCode = 33', 1)
          g = g.replace('versionName = "5.0.5.4"', 'versionName = "5.0.5.5"', 1)
          gradle.write_text(g, encoding="utf-8")

          print("Emergency Live crash fix applied.")
          PY

      - name: Verify emergency fix
        shell: bash
        run: |
          set -euo pipefail

          ENGINE="app/src/main/java/com/adwio/player/ui/player/PlaybackEngine.kt"
          LAYOUT="app/src/main/res/layout/activity_library.xml"

          ! grep -q 'startForegroundService' "$ENGINE"
          ! grep -q 'ensureLivePlaybackService' "$ENGINE"
          grep -q 'ic_aspect_ratio_live' "$LAYOUT"
          test -f app/src/main/res/drawable/ic_aspect_ratio_live.xml
          grep -q 'versionCode = 33' app/build.gradle.kts
          grep -q 'versionName = "5.0.5.5"' app/build.gradle.kts

          rm -f .github/workflows/emergency-fix-live-home-crash.yml

      - name: Commit emergency Live fix
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          ALLOWED='^(app/build.gradle.kts|app/src/main/java/com/adwio/player/ui/player/PlaybackEngine.kt|app/src/main/res/layout/activity_library.xml|app/src/main/res/drawable/ic_aspect_ratio_live.xml|.github/workflows/emergency-fix-live-home-crash.yml)$'
          BAD="$(git diff --cached --name-only | grep -Ev "$ALLOWED" || true)"

          if [ -n "$BAD" ]; then
            echo "Unexpected files changed:"
            echo "$BAD"
            exit 1
          fi

          git commit -m "Emergency fix Live Home crash and aspect icon"
          git push origin HEAD:main
