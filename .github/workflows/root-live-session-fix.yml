name: ADWIO Root Live Session Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  root-live-session:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply root LiveSession architecture
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/root_live_session.py
          python3 /tmp/root_live_session.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Compile root fix
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:compileDebugKotlin

      - name: Validate architecture
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/java/com/adwio/player/data/LiveSessionStore.kt
          grep -q 'LiveSessionStore(this)' app/src/main/java/com/adwio/player/ui/library/LibraryActivity.kt
          grep -q 'private fun restoreLiveSession' app/src/main/java/com/adwio/player/ui/library/LibraryActivity.kt
          grep -q 'liveSession.save' app/src/main/java/com/adwio/player/ui/library/LibraryActivity.kt
          grep -q 'LiveSessionStore(this).load()' app/src/main/java/com/adwio/player/ui/home/HomeActivity.kt
          grep -q 'LiveSessionStore(this).load()' app/src/main/java/com/adwio/player/ui/splash/SplashActivity.kt
          grep -q 'versionCode = 41' app/build.gradle.kts
          grep -q 'versionName = "5.3.0"' app/build.gradle.kts
          rm -f .github/workflows/root-live-session-fix.yml

      - name: Commit only after compile succeeds
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace fragmented Live state with single LiveSession store"
          git push origin HEAD:main
