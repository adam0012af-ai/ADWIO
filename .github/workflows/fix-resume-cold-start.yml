name: Fix ADWIO Resume and Cold Start Navigation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply navigation fix only
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          splash = Path("app/src/main/java/com/adwio/player/ui/splash/SplashActivity.kt")
          manifest = Path("app/src/main/AndroidManifest.xml")

          text = splash.read_text(encoding="utf-8")
          text = text.replace("import com.adwio.player.data.AppResumeState\n", "")
          text = text.replace("import com.adwio.player.ui.library.LibraryActivity\n", "")
          text = text.replace("import com.adwio.player.ui.player.PlayerActivity\n", "")

          start = text.find("    override fun onCreate(savedInstanceState: Bundle?) {")
          route = text.find("    private fun route() {")
          destroy = text.find("    override fun onDestroy()", route)

          if start == -1 or route == -1 or destroy == -1:
              raise SystemExit("SplashActivity expected structure not found")

          prefix = text[:start]
          suffix = text[destroy:]

          replacement = '''    override fun onCreate(savedInstanceState: Bundle?) {
              super.onCreate(savedInstanceState)

              // Existing task: reveal the current screen immediately.
              if (!isTaskRoot) {
                  finish()
                  overridePendingTransition(0, 0)
                  return
              }

              b = ActivitySplashBinding.inflate(layoutInflater)
              setContentView(b.root)

              b.splashContent.scaleX = 0.94f
              b.splashContent.scaleY = 0.94f
              b.splashContent.animate()
                  .alpha(1f)
                  .scaleX(1f)
                  .scaleY(1f)
                  .setDuration(520L)
                  .setInterpolator(AccelerateDecelerateInterpolator())
                  .start()

              b.loaderBar.translationX = -60f
              b.loaderBar.animate()
                  .translationX(82f)
                  .setDuration(900L)
                  .setInterpolator(AccelerateDecelerateInterpolator())
                  .start()

              handler.postDelayed({ routeColdStart() }, 1050L)
          }

          private fun routeColdStart() {
              val session = SessionStore(this).load()

              // True cold start always begins at Home.
              val target = if (session == null) {
                  Intent(this, LoginActivity::class.java)
              } else {
                  Intent(this, HomeActivity::class.java)
              }

              startActivity(target)
              finish()
          }

          '''
          splash.write_text(prefix + replacement + suffix, encoding="utf-8")

          m = manifest.read_text(encoding="utf-8")
          old = 'android:launchMode="singleTask"'
          if old not in m:
              raise SystemExit("Splash singleTask launchMode not found")
          m = m.replace(old, 'android:launchMode="singleTop"', 1)
          manifest.write_text(m, encoding="utf-8")

          print("Resume/Cold Start navigation fix applied.")
          PY

      - name: Verify navigation behavior
        shell: bash
        run: |
          set -euo pipefail

          SPLASH="app/src/main/java/com/adwio/player/ui/splash/SplashActivity.kt"
          MANIFEST="app/src/main/AndroidManifest.xml"

          grep -q 'if (!isTaskRoot)' "$SPLASH"
          grep -q 'routeColdStart()' "$SPLASH"
          grep -q 'Intent(this, HomeActivity::class.java)' "$SPLASH"
          ! grep -q 'AppResumeState' "$SPLASH"
          grep -q 'android:launchMode="singleTop"' "$MANIFEST"

          rm -f .github/workflows/fix-resume-cold-start.yml

      - name: Commit focused navigation fix
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          ALLOWED='^(app/src/main/java/com/adwio/player/ui/splash/SplashActivity.kt|app/src/main/AndroidManifest.xml|.github/workflows/fix-resume-cold-start.yml)$'
          BAD="$(git diff --cached --name-only | grep -Ev "$ALLOWED" || true)"

          if [ -n "$BAD" ]; then
            echo "Unexpected files changed:"
            echo "$BAD"
            exit 1
          fi

          git commit -m "Fix warm resume and cold start navigation"
          git push origin HEAD:main
