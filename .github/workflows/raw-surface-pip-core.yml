name: ADWIO Raw Surface PiP Core

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  raw-surface-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply raw SurfaceView PiP ownership
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/raw_surface_pip.py
          python3 /tmp/raw_surface_pip.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Compile validation
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:compileDebugKotlin

      - name: Verify exact architecture
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'setVideoSurfaceView(b.livePipSurface)' app/src/main/java/com/adwio/player/ui/library/LibraryActivity.kt
          grep -q 'clearVideoSurfaceView(b.livePipSurface)' app/src/main/java/com/adwio/player/ui/library/LibraryActivity.kt
          grep -q 'setVideoSurfaceView(b.pipSurface)' app/src/main/java/com/adwio/player/ui/player/PlayerActivity.kt
          grep -q 'android:id="@+id/livePipSurface"' app/src/main/res/layout/activity_library.xml
          grep -q 'android:id="@+id/pipSurface"' app/src/main/res/layout/activity_player.xml
          grep -q 'uiMode|keyboardHidden' app/src/main/AndroidManifest.xml
          grep -q 'versionCode = 44' app/build.gradle.kts
          grep -q 'versionName = "5.4.1"' app/build.gradle.kts
          rm -f .github/workflows/raw-surface-pip-core.yml

      - name: Commit only after compile succeeds
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use raw SurfaceView ownership for PiP playback"
          git push origin HEAD:main
