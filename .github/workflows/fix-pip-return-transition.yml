name: Fix ADWIO PiP Return and Transition

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pip-return-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply PiP return-state fix
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/fix_pip_return.py
          python3 /tmp/fix_pip_return.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Compile validation
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:compileDebugKotlin

      - name: Verify PiP return fix
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'EXTRA_RESTORE_FULLSCREEN' app/src/main/java/com/adwio/player/ui/library/LibraryActivity.kt
          grep -q 'restoreActiveLivePlaybackIfNeeded' app/src/main/java/com/adwio/player/ui/library/LibraryActivity.kt
          grep -q 'playbackMode: String' app/src/main/java/com/adwio/player/data/AppResumeState.kt
          grep -q 'resume.playbackActive' app/src/main/java/com/adwio/player/ui/splash/SplashActivity.kt
          grep -q 'ColorDrawable(Color.BLACK)' app/src/main/java/com/adwio/player/ui/BaseFullscreenActivity.kt
          grep -q 'versionCode = 39' app/build.gradle.kts
          grep -q 'versionName = "5.2.1"' app/build.gradle.kts
          rm -f .github/workflows/fix-pip-return-transition.yml

      - name: Commit only after successful compile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Live PiP return state and transition flash"
          git push origin HEAD:main
