name: Reset ADWIO to Clean 5.0.3 Source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reset-to-503:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Save clean 5.0.3 package
        shell: bash
        run: |
          set -euo pipefail
          SRC="ADWIO_5.0.3_ORIENTATION_SPORTS_FINAL.zip"
          if [ ! -f "$SRC" ]; then
            echo "ERROR: $SRC not found in repository root."
            exit 1
          fi
          cp "$SRC" /tmp/ADWIO_5.0.3_SOURCE.zip

      - name: Remove old project files
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            -exec rm -rf {} +
          mkdir -p .github/workflows
          find .github/workflows -type f -delete

      - name: Extract ADWIO 5.0.3 as new root project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/adwio503
          unzip -q /tmp/ADWIO_5.0.3_SOURCE.zip -d /tmp/adwio503
          if [ -d /tmp/adwio503/ADWIO-main ]; then
            cp -a /tmp/adwio503/ADWIO-main/. .
          else
            cp -a /tmp/adwio503/. .
          fi
          rm -rf .github/workflows
          mkdir -p .github/workflows

      - name: Validate clean project
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts || test -f settings.gradle
          test -f app/build.gradle.kts || test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

      - name: Add fresh build workflow
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/build-adwio-503.yml <<'YAML'
          name: Build ADWIO 5.0.3 Clean

          on:
            workflow_dispatch:
            push:
              branches:
                - main

          permissions:
            contents: read

          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4

                - name: Set up Java 17
                  uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: '17'

                - name: Set up Gradle
                  uses: gradle/actions/setup-gradle@v6
                  with:
                    gradle-version: '9.5.0'

                - name: Build debug APK
                  shell: bash
                  run: |
                    set -euo pipefail
                    gradle --no-daemon :app:assembleDebug

                - name: Upload APK
                  uses: actions/upload-artifact@v4
                  with:
                    name: ADWIO-5.0.3-Clean-APK
                    path: app/build/outputs/apk/debug/*.apk
                    if-no-files-found: error
          YAML

      - name: Commit clean 5.0.3 project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Reset repository to clean ADWIO 5.0.3 source"
          git push origin HEAD:main
