<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADWIO Control</title>
<style>body{margin:0;background:#090b10;color:#f4f6fb;font:14px system-ui}.wrap{max-width:1100px;margin:auto;padding:28px}.top{display:flex;gap:12px;align-items:center}.brand{font-size:22px;font-weight:800}.muted{color:#8992a5}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}.card,.panel{background:#11151d;border:1px solid #242b38;border-radius:14px;padding:18px}.num{font-size:30px;font-weight:800;margin-top:8px}.online{color:#65e6a5}input,button{background:#151b25;color:white;border:1px solid #303949;border-radius:9px;padding:9px}button{cursor:pointer}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #202632}th{color:#8992a5;font-weight:600}@media(max-width:700px){.cards{grid-template-columns:1fr}}</style>
<div class="wrap"><div class="top"><div><div class="brand">ADWIO Control</div><div class="muted">Private operational dashboard</div></div><div style="margin-left:auto"><input id="token" type="password" placeholder="Admin token"><button onclick="load()">Connect</button></div></div>
<div class="cards"><div class="card"><div class="muted">Online now</div><div id="online" class="num online">—</div></div><div class="card"><div class="muted">Total devices</div><div id="total" class="num">—</div></div><div class="card"><div class="muted">Active today</div><div id="today" class="num">—</div></div></div>
<div class="panel"><h3>Hosts</h3><table><thead><tr><th>Host</th><th>Online</th><th>Devices</th><th>Xtream</th><th>M3U</th><th>Last seen</th></tr></thead><tbody id="hosts"></tbody></table></div></div>
<script>async function load(){const t=document.getElementById('token').value;const r=await fetch('/api/dashboard',{headers:{Authorization:'Bearer '+t}});if(!r.ok){alert('Access denied');return}const d=await r.json();online.textContent=d.online;total.textContent=d.totalDevices;today.textContent=d.activeToday;hosts.innerHTML=d.hosts.map(h=>`<tr><td>${esc(h.host)}</td><td>${h.online}</td><td>${h.total}</td><td>${h.xtream}</td><td>${h.m3u}</td><td>${new Date(h.lastSeen).toLocaleString()}</td></tr>`).join('')}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></html>
