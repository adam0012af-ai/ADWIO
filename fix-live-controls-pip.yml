name: Fix ADWIO Live Controls Fullscreen and PiP Playback

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  live-fix:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Live-only playback and controls fixes
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import base64

          def dec(v):
              return base64.b64decode(v).decode("utf-8")

          def rep(path, old64, new64, label):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              old = dec(old64)
              new = dec(new64)
              if old not in text:
                  raise SystemExit(f"Missing expected block: {label}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          lib = "app/src/main/java/com/adwio/player/ui/library/LibraryActivity.kt"
          engine = "app/src/main/java/com/adwio/player/ui/player/PlaybackEngine.kt"
          layout = "app/src/main/res/layout/activity_library.xml"
          gradle = Path("app/build.gradle.kts")

          rep(lib, "", "", "Live control listeners")
          rep(lib, "ICAgICAgICBpZiAoaXNJblBpY3R1cmVJblBpY3R1cmVNb2RlKSB7CiAgICAgICAgICAgIHdhc01pbmlQaXAgPSB0cnVlCiAgICAgICAgICAgIHByZXBhcmVNaW5pUGlwVWkoKQogICAgICAgIH0gZWxzZSB7CiAgICAgICAgICAgIHJlc3RvcmVNaW5pVWkoKQogICAgICAgIH0KICAgIH0=", "", "PiP keep playing")
          rep(lib, "", "", "FIT fullscreen")
          rep(lib, "ICAgICAgICBsaXZlRnVsbHNjcmVlbk1vZGUgPSBmYWxzZQogICAgICAgIHJlc3RvcmVOb3JtYWxMaXZlVWkoKQogICAgICAgIGIucHJldmlld1BsYXllci5wbGF5ZXIgPSBQbGF5YmFja0VuZ2luZS5wbGF5ZXIKICAgICAgICBiLnByZXZpZXdQbGF5ZXIucmVxdWVzdEZvY3VzKCkKICAgIH0=", "", "Exit fullscreen + aspect control")
          rep(lib, "ICAgICAgICBiLnRvcEJhci52aXNpYmlsaXR5ID0gVmlldy5HT05FCiAgICAgICAgYi5jYXRlZ29yeVBhbmVsLnZpc2liaWxpdHkgPSBWaWV3LkdPTkUKICAgICAgICBiLmNvbnRlbnRSZWN5Y2xlci52aXNpYmlsaXR5ID0gVmlldy5HT05FCiAgICAgICAgYi5wcmV2aWV3Rm9vdGVyLnZpc2liaWxpdHkgPSBWaWV3LkdPTkU=", "", "Fullscreen control strip visibility")
          rep(lib, "", "", "Fullscreen FIT playback")
          rep(lib, "ICAgICAgICBiLnRvcEJhci52aXNpYmlsaXR5ID0gVmlldy5WSVNJQkxFCiAgICAgICAgYi5jYXRlZ29yeVBhbmVsLnZpc2liaWxpdHkgPSBWaWV3LlZJU0lCTEUKICAgICAgICBiLmNvbnRlbnRSZWN5Y2xlci52aXNpYmlsaXR5ID0gVmlldy5WSVNJQkxFCiAgICAgICAgYi5wcmV2aWV3Rm9vdGVyLnZpc2liaWxpdHkgPSBWaWV3LlZJU0lCTEU=", "", "Restore mini controls")
          rep(lib, "ICAgICAgICBpZiAodHlwZSA9PSBNZWRpYVR5cGUuTElWRSAmJiAhaW5NaW5pUGlwICYmCiAgICAgICAgICAgIFBsYXliYWNrRW5naW5lLnBsYXllciAhPSBudWxsICYmIFBsYXliYWNrRW5naW5lLmN1cnJlbnRUeXBlID09IE1lZGlhVHlwZS5MSVZFCiAgICAgICAgKSB7CiAgICAgICAgICAgIGIucHJldmlld1BsYXllci5wbGF5ZXIgPSBQbGF5YmFja0VuZ2luZS5wbGF5ZXIKICAgICAgICB9", "", "Resume same Live player")

          rep(engine, "aW1wb3J0IGFuZHJvaWQuY29udGVudC5Db250ZXh0CmltcG9ydCBhbmRyb2lkeC5tZWRpYTMuY29tbW9uLk1lZGlhSXRlbQo=", "aW1wb3J0IGFuZHJvaWQuY29udGVudC5Db250ZXh0CmltcG9ydCBhbmRyb2lkLmNvbnRlbnQuSW50ZW50CmltcG9ydCBhbmRyb2lkLm9zLkJ1aWxkCmltcG9ydCBhbmRyb2lkeC5jb3JlLmNvbnRlbnQuQ29udGV4dENvbXBhdAppbXBvcnQgYW5kcm9pZHgubWVkaWEzLmNvbW1vbi5NZWRpYUl0ZW0K", "PlaybackEngine service imports")
          rep(engine, "ICAgICAgICBwLnBsYXlXaGVuUmVhZHkgPSB0cnVlCiAgICAgICAgcC52b2x1bWUgPSAxZgogICAgICAgIHJldHVybiBwCiAgICB9CgogICAgZnVuIHVwZGF0ZU1ldGFkYXRh", "", "Start live MediaSessionService")

          rep(layout, "", "", "Live fullscreen control footer")

          g = gradle.read_text(encoding="utf-8")
          if 'versionCode = 31' not in g or 'versionName = "5.0.5.3"' not in g:
              raise SystemExit("Unexpected ADWIO version baseline")
          g = g.replace('versionCode = 31', 'versionCode = 32', 1)
          g = g.replace('versionName = "5.0.5.3"', 'versionName = "5.0.5.4"', 1)
          gradle.write_text(g, encoding="utf-8")

          print("Live controls/fullscreen/PiP playback fix applied.")
          PY

      - name: Verify Live fix
        shell: bash
        run: |
          set -euo pipefail

          LIB="app/src/main/java/com/adwio/player/ui/library/LibraryActivity.kt"
          ENGINE="app/src/main/java/com/adwio/player/ui/player/PlaybackEngine.kt"
          LAYOUT="app/src/main/res/layout/activity_library.xml"

          grep -q 'previewBackButton' "$LIB"
          grep -q 'previewAspectButton' "$LIB"
          grep -q 'cycleLiveAspectRatio' "$LIB"
          grep -q 'RESIZE_MODE_FIT' "$LIB"
          grep -q 'ensureLivePlaybackService' "$ENGINE"
          grep -q 'ContextCompat.startForegroundService' "$ENGINE"
          grep -q 'android:id="@+id/previewBackButton"' "$LAYOUT"
          grep -q 'android:id="@+id/previewAspectButton"' "$LAYOUT"
          grep -q 'versionCode = 32' app/build.gradle.kts
          grep -q 'versionName = "5.0.5.4"' app/build.gradle.kts

          rm -f .github/workflows/fix-live-controls-pip.yml

      - name: Commit Live-only fix
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          ALLOWED='^(app/build.gradle.kts|app/src/main/java/com/adwio/player/ui/library/LibraryActivity.kt|app/src/main/java/com/adwio/player/ui/player/PlaybackEngine.kt|app/src/main/res/layout/activity_library.xml|.github/workflows/fix-live-controls-pip.yml)$'
          BAD="$(git diff --cached --name-only | grep -Ev "$ALLOWED" || true)"

          if [ -n "$BAD" ]; then
            echo "Unexpected files changed:"
            echo "$BAD"
            exit 1
          fi

          git commit -m "Fix Live controls fullscreen aspect and PiP playback"
          git push origin HEAD:main
