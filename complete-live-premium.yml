name: Complete ADWIO Live Premium Section

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  live-premium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Live Premium UI and fullscreen controls
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/apply_live_premium.py
          python3 /tmp/apply_live_premium.py

      - name: Verify Live Premium implementation
        shell: bash
        run: |
          set -euo pipefail
          KT="app/src/main/java/com/adwio/player/ui/library/LibraryActivity.kt"
          XML="app/src/main/res/layout/activity_library.xml"
          grep -q 'toggleFullscreenChannels' "$KT"
          grep -q 'showLiveTrackPicker' "$KT"
          grep -q 'postDelayed(hideLiveControlsRunnable, 3000L)' "$KT"
          grep -q 'fullscreenChannelsOverlay' "$XML"
          grep -q 'previewAudioButton' "$XML"
          grep -q 'previewSubtitleButton' "$XML"
          grep -q 'versionCode = 35' app/build.gradle.kts
          grep -q 'versionName = "5.1.0"' app/build.gradle.kts
          rm -f .github/workflows/complete-live-premium.yml

      - name: Commit Live Premium section
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          ALLOWED='^(app/build.gradle.kts|app/src/main/java/com/adwio/player/ui/library/LibraryActivity.kt|app/src/main/res/layout/activity_library.xml|app/src/main/res/drawable/ic_list.xml|app/src/main/res/drawable/ic_volume.xml|app/src/main/res/drawable/ic_subtitles.xml|.github/workflows/complete-live-premium.yml)$'
          BAD="$(git diff --cached --name-only | grep -Ev "$ALLOWED" || true)"
          if [ -n "$BAD" ]; then echo "Unexpected files changed:"; echo "$BAD"; exit 1; fi
          git commit -m "Complete ADWIO Live Premium fullscreen and controls"
          git push origin HEAD:main
